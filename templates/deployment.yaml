{{ if eq (include "nifi.secretSyncEnabled" .) "true" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "apache-nifi.fullname" . }}-config-sync
  labels:
{{- include "nifi.commonLabels" . | nindent 4 }}
    app: {{ include "apache-nifi.name" . |  quote }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}"
    release: {{ .Release.Name | quote }}
    heritage: {{ .Release.Service | quote }}
spec:
  #podManagementPolicy: {{ .Values.sts.podManagementPolicy }}
  replicas: 1
  selector:
    matchLabels:
      app: {{ template "apache-nifi.name" . }}
      release: {{ .Release.Name }}
      
  template:
    metadata:
      annotations:
{{- if .Values.sts.pod.annotations }}
{{ toYaml .Values.sts.pod.annotations | indent 8 }}
{{- end }}
      labels:
        {{- include "nifi.commonLabels" . | nindent 8 }}
        role: "config-sync"
        app:  {{ include "apache-nifi.name" .  | quote }}
        chart: "{{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}"
        release: {{ .Release.Name | quote }}
        heritage: {{ .Release.Service | quote }}
    spec:
{{- if .Values.schedulerName }}
      schedulerName: {{ .Values.schedulerName }}
{{- end }}
{{- if .Values.sts.useHostNetwork }}
      hostNetwork: {{ .Values.sts.useHostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
{{- end }}
{{- if .Values.sts.hostAliases }}
      hostAliases:
{{ toYaml .Values.sts.hostAliases | indent 8 }}
{{- end }}
      serviceAccountName: {{ include "apache-nifi.serviceAccountName" . }}
      {{- if .Values.affinity }}
      affinity:
{{ toYaml .Values.affinity | indent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
{{- end }}
{{- if .Values.tolerations }}
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
{{- end }}
{{- if .Values.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
{{- end }}
{{- if .Values.securityContext }}
      securityContext:
{{ toYaml .Values.securityContext | indent 8 }}
{{- end }}
#--------------------START Vault Sidecar
{{- $vals := .Values.VaultNiFiSecrets -}}
{{- $caSecrets := .Values.caSecrets -}}
{{- $caSecretName := default "" $vals.vaultSidecar.caSecretName -}}
{{- if and (eq $caSecretName "") (gt (len $caSecrets) 0) -}}
{{- $caSecretName = index $caSecrets 0 -}}
{{- end -}}
{{- $caBundlePath := "/opt/nifi/nifi-current/tls/ca-bundle/ca-bundle.pem" -}}
{{- if ne $caSecretName "" }}
      initContainers:
      - name: prepare-ca-bundle
        image: {{ default (printf "%s:%s" .Values.images.utility.repository .Values.images.utility.tag) .Values.NiFiSync.s3Sync.sidecar.image }}
        imagePullPolicy: {{ .Values.images.utility.pullPolicy }}
        command: ["/bin/sh", "-ec"]
        args:
          - |
            set -e
            out=/work/ca-bundle.pem
            : > "$out"
            
            # If s3sync is enabled, merge system CA bundle with custom CAs for boto3
            {{- if .Values.NiFiSync.s3Sync.enabled }}
            merged=/merged-certs/ca-bundle.crt
            : > "$merged"
            # Try RHEL/UBI then Debian/Alpine system CA paths
            for system_ca in /etc/pki/tls/certs/ca-bundle.crt /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem /etc/ssl/certs/ca-certificates.crt; do
              if [ -f "$system_ca" ]; then
                cat "$system_ca" >> "$merged"
                printf '\n' >> "$merged"
                echo "Added system CA bundle from $system_ca"
                break
              fi
            done
            {{- end }}
            
            # Extract and bundle custom CA files
            found=0
            for file in /input/*; do
              [ -f "$file" ] || continue
              case "$file" in
                *.crt|*.cer|*.pem)
                  cat "$file" >> "$out"
                  printf '\n' >> "$out"
                  {{- if .Values.NiFiSync.s3Sync.enabled }}
                  cat "$file" >> "$merged"
                  printf '\n' >> "$merged"
                  {{- end }}
                  found=1
                  ;;
              esac
            done
            if [ "$found" -eq 0 ]; then
              echo "No CA files found in /input" >&2
              exit 1
            fi
            {{- if .Values.NiFiSync.s3Sync.enabled }}
            chmod 644 "$merged"
            echo "Merged CA bundle created at /merged-certs/ca-bundle.crt"
            {{- end }}
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
          - name: {{ $caSecretName }}
            mountPath: /input
            readOnly: true
          - name: vault-ca-bundle
            mountPath: /work
          {{- if .Values.NiFiSync.s3Sync.enabled }}
          - name: merged-ca-bundle
            mountPath: /merged-certs
          {{- end }}
{{- end }}
      containers:
{{- if and $vals.enabled (eq (default "" $vals.secretProvider) "vaultSidecar") }}

      - name: vault-sidecar
        image: {{ required "VaultNiFiSecrets.vaultSidecar.image must be set when secretProvider=vaultSidecar" .Values.VaultNiFiSecrets.vaultSidecar.image }}
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: 8080
        env:
          - name: CONFIG_FILE
            value: /etc/vault-sidecar/config.yaml
          - name: LOG_LEVEL
            value: "INFO"
          - name: UVICORN_LOG_LEVEL
            value: "info"
          - name: ENABLE_KAFKA_LOGGING
            value: "True"
          {{- if ne $caSecretName "" }}
          - name: REQUESTS_CA_BUNDLE
            value: {{ $caBundlePath }}
          - name: SSL_CERT_FILE
            value: {{ $caBundlePath }}
          {{- end }}
        volumeMounts:
          - name: vault-sidecar-config
            mountPath: /etc/vault-sidecar
            readOnly: true
          - name: secretfspath
            mountPath: {{ default "/opt/nifi/secrets" $vals.defaultContainerPath }}
          {{- if ne $caSecretName "" }}
          - name: {{ $caSecretName }}
            mountPath: /opt/nifi/nifi-current/tls/{{ $caSecretName }}
            readOnly: true
          - name: vault-ca-bundle
            mountPath: /opt/nifi/nifi-current/tls/ca-bundle
          {{- end }}
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
{{- end }}
#--------------------END Vault Sidecar
{{ if .Values.NiFiSync.s3Sync.enabled }}
      - name: s3-secret-sync
        image: {{ default (printf "%s:%s" .Values.images.utility.repository .Values.images.utility.tag) .Values.NiFiSync.s3Sync.sidecar.image }}
        resources:
{{ toYaml .Values.NiFiSync.s3Sync.resources | indent 10 }}

{{- if .Values.envFrom }}
        envFrom:
{{ toYaml .Values.envFrom | indent 8 }}
{{- end }}


        env:
        - name: S3_BUCKET
          value: {{ .Values.NiFiSync.s3Sync.bucket }}
        - name: S3_ENDPOINT
          value: {{ .Values.NiFiSync.s3Sync.endpoint }}
        - name: instanceName
          value: {{ template "apache-nifi.fullname" $ }}
        - name: USE_IRSA
          value: {{ .Values.NiFiSync.s3Sync.useIRSA | quote }}
        - name: S3_INSECURE
          value: {{ .Values.NiFiSync.s3Sync.insecure | quote }}
        - name: AWS_DEFAULT_REGION
          value: {{ .Values.NiFiSync.s3Sync.region | quote }}
        {{- if ne $caSecretName "" }}
        - name: REQUESTS_CA_BUNDLE
          value: /merged-ca-bundle/ca-bundle.crt
        - name: SSL_CERT_FILE
          value: /merged-ca-bundle/ca-bundle.crt
        - name: AWS_CA_BUNDLE
          value: /merged-ca-bundle/ca-bundle.crt
        {{- end }}
        command: ["/bin/sh", "-c"]
        args:
        - |
          #!/bin/sh
          # --- Prefix every stdout/stderr line with an ISO-8601 UTC timestamp ---
          # Routes all output (including raw stderr from sub-tools like base64)
          # through one timestamper so every log line is machine-parseable.
          if _ts_fifo="$(mktemp -u /tmp/ts.XXXXXX)" && mkfifo "$_ts_fifo" 2>/dev/null; then
            while IFS= read -r _ts_line; do
              printf '%s - %s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$_ts_line"
            done < "$_ts_fifo" &
            exec > "$_ts_fifo" 2>&1
            rm -f "$_ts_fifo"
          fi
          # --- end timestamp wrapper ---
{{- /* START Wait for vault sidecar HTTP readiness on /ready (tries curl, wget, nc, falls back to port check) */ -}}
{{- if and $vals.enabled (eq (default "" $vals.secretProvider) "vaultSidecar") }}
          wait_for_sidecar_http_ready() {
            local url="${1:-http://127.0.0.1:8080/ready}"
            local timeout=${WAIT_SIDECAR_TIMEOUT:-120}
            local interval=${WAIT_SIDECAR_INTERVAL:-2}
            local start=$(date +%s)

            echo "Waiting for sidecar HTTP readiness at $url (timeout ${timeout}s)..."
            while :; do
              if command -v curl >/dev/null 2>&1; then
                if curl -sSf --connect-timeout 5 "$url" >/dev/null 2>&1; then
                  echo "Sidecar HTTP readiness succeeded via curl"
                  return 0
                fi
              elif command -v wget >/dev/null 2>&1; then
                if wget -qO- --timeout=5 "$url" >/dev/null 2>&1; then
                  echo "Sidecar HTTP readiness succeeded via wget"
                  return 0
                fi
              elif command -v nc >/dev/null 2>&1; then
                if printf "GET /ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" | nc 127.0.0.1 8080 2>/dev/null | grep -q "HTTP/1\.[01] 2[0-9][0-9]"; then
                  echo "Sidecar HTTP readiness succeeded via nc"
                  return 0
                fi
              fi
              local now=$(date +%s)
              if [ $(( now - start )) -ge "$timeout" ]; then
                echo "Timed out waiting for sidecar HTTP readiness at $url" >&2
                return 1
              fi
              sleep "$interval"
            done
          }
          # Block until vault sidecar reports /ready
          if ! wait_for_sidecar_http_ready http://127.0.0.1:8080/ready; then
            echo "Sidecar did not become ready; aborting startup" >&2
            exit 1
          fi 
          
          #END Wait for vault sidecar 
{{- end }}
{{/* END Wait for vault sidecar readiness */}}
{{- if and $vals.enabled (eq (default "" $vals.secretProvider) "vaultSidecar") }}
          # Wait until every secret directory has at least one file on disk.
          # The SDK /ready endpoint fires before the first sync cycle writes files.
          # Only wait for secrets with secretMode: directory
          _svault_timeout=${WAIT_SIDECAR_TIMEOUT:-120}
          _svault_start=$(date +%s)
          {{- range $s := $vals.secrets }}
          {{- $mode := default $vals.defaultSecretMode $s.secretMode }}
          {{- if eq $mode "directory" }}
          echo "Waiting for secret files in {{ $vals.defaultContainerPath }}/{{ $s.name }} ..."
          while [ -z "$(ls -A '{{ $vals.defaultContainerPath }}/{{ $s.name }}' 2>/dev/null)" ]; do
            if [ $(( $(date +%s) - _svault_start )) -ge "$_svault_timeout" ]; then
              echo "Timed out waiting for secret files in {{ $vals.defaultContainerPath }}/{{ $s.name }}" >&2
              exit 1
            fi
            sleep 2
          done
          echo "Secret files present in {{ $vals.defaultContainerPath }}/{{ $s.name }}"
          {{- end }}
          {{- end }}
          unset _svault_timeout _svault_start
          # Flatten each vault secret's subdirectory into secretsFilePath so all
          # secret files are accessible from a single directory.
          # Only flatten secrets with secretMode: directory
          {{- $sp := .Values.properties.secretsFilePath }}
          mkdir -p "{{ $sp }}"
          {{- range $s := $vals.secrets }}
          {{- $mode := default $vals.defaultSecretMode $s.secretMode }}
          {{- if eq $mode "directory" }}
          {{- $srcDir := printf "%s/%s" $vals.defaultContainerPath $s.name }}
          {{- if ne $srcDir $sp }}
          for _f in "{{ $srcDir }}"/*; do
            [ -f "$_f" ] || continue
            cp "$_f" "{{ $sp }}/$(basename "$_f")"
          done
          {{- end }}
          {{- end }}
{{- end }}
{{- end }}
          # s3sync.py replaces the MinIO `mc` client; credentials resolve via the
          # boto3 default chain (IRSA) or S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY.
          S3SYNC=/scripts/s3sync.py
          export S3_BUCKET S3_ENDPOINT instanceName
          {{- if and (not .Values.NiFiSync.s3Sync.useIRSA) (ne (include "nifi.effectiveSecretsMode" .) "none") (ne "" (default "" .Values.properties.secretsFilePath)) }}
          # Load S3 credentials from the secrets file directory (non-IRSA)
          _sp={{ .Values.properties.secretsFilePath | quote }}
          export S3_ACCESS_KEY_ID="$(tr -d '\r\n' < "$_sp/S3_ACCESS_KEY_ID" 2>/dev/null)"
          export S3_SECRET_ACCESS_KEY="$(tr -d '\r\n' < "$_sp/S3_SECRET_ACCESS_KEY" 2>/dev/null)"
          unset _sp
          {{- end }}

          # Block until the S3 bucket is reachable (replaces mc alias retry loop)
          python3 "$S3SYNC" wait-ready

          # Initial synchronization logic: ensure remote prefixes exist
          {{- range (include "nifi.syncPaths" . | fromJsonArray) }}
          # Sync Secrets
          {{- if ne .pathType "fs" }}
          {{- $root := default "$instanceName" .remoteRoot }}
          echo "INFO - Sync Secret Path: {{ .localPath }} with S3: $S3_BUCKET/{{ $root }}/{{ .remotePath }}"

          if [ ! -d "/tmp/sync{{ .localPath }}" ]; then
            mkdir -p /tmp/sync{{ .localPath }}
          fi

          # Check if remote path exists in S3, if not, create it by uploading an empty placeholder
          if ! python3 "$S3SYNC" prefix-exists --remote "{{ $root }}/{{ .remotePath }}"; then
            echo "INFO - Creating Remote Path {{ $root }}/{{ .remotePath }} in S3"
            python3 "$S3SYNC" put-placeholder --remote "{{ $root }}/{{ .remotePath }}"
          fi
          {{- end }}
          # END Sync Secrets
          {{- end }}
          while true; do
            echo "INFO - --------------------------- Starting S3 to Kubernetes Secrets Sync Process --------------------------"
            echo "INFO - --------------------------- Starting S3 File Sync --------------------------"

            SYNC_SUCCESS=1  # Initialize sync success flag

            {{- range (include "nifi.syncPaths" . | fromJsonArray) }}
            {{- if ne .pathType "fs" }}
            {{- $root := default "$instanceName" .remoteRoot }}
            echo "INFO - Syncing Remote Path {{ $root }}/{{ .remotePath }} to /tmp/sync{{ .localPath }}"

            if ! python3 "$S3SYNC" mirror-down --remote "{{ $root }}/{{ .remotePath }}" --local /tmp/sync{{ .localPath }} --exclude .placeholder{{- if $.Values.NiFiSync.s3Sync.overwrite }} --overwrite{{- end }}; then
              echo "Warning: Sync failed for {{ .localPath }}. S3 might be unavailable."
              SYNC_SUCCESS=0  # Set sync success flag to 0 if any sync fails
            fi
            {{- end }}
            {{- end }}

            echo "INFO - --------------------------- Completed S3 File Sync --------------------------"

            if [ "$SYNC_SUCCESS" -eq 1 ]; then
              echo "INFO - --------------------------- Starting Kubernetes Secret Sync --------------------------"
              sh /scripts/create-secrets-vault.sh
              echo "INFO - --------------------------- Completed Kubernetes Secret Sync --------------------------"
            else
              echo "INFO - Skipping Kubernetes Secret Sync due to S3 sync errors."
            fi

            echo "INFO - --------------------------- Completed S3 to Kubernetes Secrets Sync Process --------------------------"
            echo "INFO - Next Sync: {{ $.Values.NiFiSync.s3Sync.syncInterval }} "
            sleep {{ $.Values.NiFiSync.s3Sync.syncInterval }}
          done
        volumeMounts:
      # VaultSecretMounts
      {{- $vals := .Values.VaultNiFiSecrets }}
      {{- if and $vals.enabled (eq (default "" $vals.secretProvider) "vaultSidecar") }}
        - name: secretfspath
          mountPath: {{ default "/opt/nifi/secrets" $vals.defaultContainerPath }}
        - name: vault-sync-script
          mountPath: /etc/vault-sidecar/script
      {{- end }}
      # END VaultSecretMounts
        {{- $vaultOwnsSecretsPath := and .Values.VaultNiFiSecrets.enabled (eq (default "" .Values.VaultNiFiSecrets.secretProvider) "vaultSidecar") }}
        {{- if and .Values.properties.secretsName (ne (include "nifi.effectiveSecretsMode" .) "none") (not $vaultOwnsSecretsPath) }}
        - name: k8s-secrets
          mountPath: {{ default "/opt/nifi/secrets" .Values.properties.secretsFilePath }}
          readOnly: true
        {{- end }}
        - mountPath: /run/secrets/kubernetes.io/default-token
          name: default-token   
        - mountPath: /run/secrets/kubernetes.io/secret-modifier-token
          name: secret-modifier-token
        - mountPath: /scripts
          name: nifisync-scripts
        {{- if ne $caSecretName "" }}
        - name: vault-ca-bundle
          mountPath: /opt/nifi/nifi-current/tls/ca-bundle
          readOnly: true
        - name: merged-ca-bundle
          mountPath: /merged-ca-bundle
          readOnly: true
        {{- end }}
      volumes:
    #VaultSecretVolumes
      {{- $vals := .Values.VaultNiFiSecrets }}
      {{- $caSecrets := .Values.caSecrets -}}
      {{- $caSecretName := default "" $vals.vaultSidecar.caSecretName -}}
      {{- if and (eq $caSecretName "") (gt (len $caSecrets) 0) -}}
      {{- $caSecretName = index $caSecrets 0 -}}
      {{- end -}}
      {{- if and $vals.enabled (eq (default "" $vals.secretProvider) "vaultSidecar") }}
      - name: vault-sidecar-config
        configMap:
          name: vault-sidecar-config
      - name: vault-sync-script
        configMap:
          name: vault-sync-script
          defaultMode: 0550
      - name: secretfspath
        emptyDir: {} 
      {{- end }}
      {{- if ne $caSecretName "" }}
      - name: {{ $caSecretName }}
        secret:
          secretName: {{ $caSecretName }}
      - name: vault-ca-bundle
        emptyDir: {}
      {{- if .Values.NiFiSync.s3Sync.enabled }}
      - name: merged-ca-bundle
        emptyDir: {}
      {{- end }}
      {{- end }}
      #END VaultSecretVolumes
{{- if .Values.NiFiSync.s3Sync.enabled}}
      {{- if and .Values.properties.secretsName (ne (include "nifi.effectiveSecretsMode" .) "none") }}
      - name: k8s-secrets
        secret:
          secretName: {{ .Values.properties.secretsName }}
      {{- end }}
      - name: nifisync-scripts
        configMap:
          name: {{ template "apache-nifi.fullname" $ }}-nifisync-scripts
      - name: secret-modifier-token
        secret:
          secretName: {{ template "apache-nifi.fullname" $ }}-sync-secret-modifier-token
      - name: default-token
        secret:
          secretName: {{ template "apache-nifi.fullname" $ }}-sync-default-token
{{- /* if .Values.NiFiSync.s3Sync.enabled */}}{{ end }}
{{/* if .Values.NiFiSync.s3Sync.enabled */}}{{ end }}
