{{- $root := . -}}
{{- $vals := $root.Values.VaultNiFiSecrets -}}
#if using VSO
{{- if and $vals.enabled ( eq $vals.secretProvider "vaultSidecar") -}}
{{- /* Resolve globals (new keys preferred, fall back to legacy) */ -}}
{{- $globalMount := or $vals.defaultMount $vals.mount -}}
{{- $globalNamespace := or $vals.defaultNamespace $vals.namespace -}}
{{- $globalRole := or $vals.defaultRole $vals.role -}}
{{- $globalPath := or $vals.defaultPath $vals.path -}}
{{- $globalAuthPath := or $vals.defaultAuthPath $vals.authPath -}}
{{- $caSecrets := .Values.caSecrets -}}
{{- $caSecretName := default "" $vals.vaultSidecar.caSecretName -}}
{{- if and (eq $caSecretName "") (gt (len $caSecrets) 0) -}}
{{- $caSecretName = index $caSecrets 0 -}}
{{- end -}}
{{- $caBundlePath := "/opt/nifi/nifi-current/tls/ca-bundle/ca-bundle.pem" -}}
{{- /* Ensure we have a non-empty role key for naming — use 'default' if global role empty */ -}}
{{- $globalRoleKey := default "default" $globalRole -}}

{{- /* 1) Build set of unique role keys to render VaultAuths for (include the global roleKey) */ -}}
{{- $roleSet := dict -}}
{{- $roleSet = set $roleSet $globalRoleKey true -}}

---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ $root.Release.Namespace }}
  name: vault-sidecar-config
data:
  config.yaml: |
    app_identifier: "{{ template "apache-nifi.fullname" $ }}-vault-sync"
    secrets_base_path: {{ $vals.defaultContainerPath }}
    log_level: {{ default "INFO" $vals.logLevel }}
    vault:
      address: {{ $vals.defaultSecretAddress}}
    {{- if ne $caSecretName "" }}
      verify: {{ $caBundlePath }}
    {{- else if (default false $vals.vaultSidecar.skipTlsVerify) }}
      verify: false
    {{- else }}
      verify: true
    {{- end }}
      kubernetes_role: {{ $globalRole }}
      kubernetes_auth_path: {{ $globalAuthPath}}
      namespace: {{ $globalNamespace}}
    kvs:
{{- $defaultMode := default $vals.defaultSecretMode "directory" }}
{{- if eq $defaultMode "env" }}{{ fail "VaultNiFiSecrets.defaultSecretMode=env was removed in 2.10. Use file, directory, or aws-credential." }}{{ end }}
{{- range $secret := $vals.secrets }}
{{- $mode := default $vals.defaultSecretMode $secret.secretMode }}
{{- $kvDefault := default 2 $vals.defaultKvVersion }}
{{- if eq $mode "aws-credential" }}{{- $kvDefault = 1 }}{{- end }}
{{- if eq $mode "env" }}{{ fail (printf "VaultNiFiSecrets.secrets[%s].secretMode=env was removed in 2.10. Use file, directory, or aws-credential." $secret.name) }}{{ end }}
    - mount: {{ default $globalMount $secret.mount }}
      secret_path: {{ if $secret.path }}{{ printf "%s/%s" $secret.path $secret.name }}{{ else }}{{ printf "%s/%s" $globalPath $secret.name }}{{ end }}
      kv_version: {{ default $kvDefault $secret.kvVersion }}
      output_file: {{ default $secret.name $secret.outputFile }}
      secretMode: {{ $mode }}
{{- if $secret.containerPath }}
      containerPath: {{ $secret.containerPath }}
{{- end }}
{{- if $secret.format }}
      format: {{ $secret.format }}
{{- end }}
{{- if $secret.awsCredentialFormat }}
      awsCredentialFormat: {{ $secret.awsCredentialFormat }}
{{- end }}
{{- if $secret.flattenTo }}
      flattenTo: {{ $secret.flattenTo }}
{{- end }}
{{- end }}
    sync:
      mode: {{ $vals.vaultSidecar.syncMode }}
      interval_minutes: {{ $vals.vaultSidecar.syncInterval }}
{{- if and $vals.enabled $vals.vaultSidecar.logging }}
    output:
      kafka:
        restproxy_url: {{ $vals.vaultSidecar.restproxy_url | quote }}
        topic: {{ $vals.vaultSidecar.topic | quote }}
        acks: "1"
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ $root.Release.Namespace }}
  name: vault-sync-script
data:
  vault-sync.py: |
    #!/usr/bin/env python3
    """Vault KV sidecar for NiFi.

    Fetches secrets from HashiCorp Vault (KV v1/v2) using Kubernetes
    service-account authentication and writes them to the local filesystem.
    In `directory` mode, each Vault key becomes a separate file inside a
    per-secret subdirectory.  An optional `flattenTo` path also copies those
    keys directly into a flat directory so `secretsMode: file-dir` can read
    them without descending into the subdirectory.
    """
    import json
    import logging
    import os
    import re
    import sys
    import time
    from pathlib import Path

    try:
        import hvac
        import yaml
    except ImportError as exc:
        print(f"Missing dependency: {exc}. Install with: pip install hvac pyyaml", file=sys.stderr)
        sys.exit(1)


    def setup_logging(log_level: str = "INFO") -> logging.Logger:
        logging.basicConfig(
            format="%(asctime)s %(levelname)-8s %(message)s",
            datefmt="%Y-%m-%dT%H:%M:%S",
            level=getattr(logging, log_level.upper(), logging.INFO),
        )
        return logging.getLogger("vault-sync")


    def load_config(config_path: str) -> dict:
        with open(config_path) as f:
            return yaml.safe_load(f) or {}


    def _atomic_write(dest: Path, content: str) -> None:
        """Write *content* to *dest* atomically via a sibling temp file."""
        dest.parent.mkdir(parents=True, exist_ok=True)
        tmp = dest.with_suffix(".tmp")
        tmp.write_text(content, encoding="utf-8")
        os.chmod(tmp, 0o600)
        tmp.rename(dest)


    def _first_present(data: dict, aliases: list[str]) -> str:
        for key in aliases:
            if key in data and data[key] is not None:
                val = str(data[key]).strip()
                if val:
                    return val
        return ""


    def _k8s_login(client: hvac.Client, role: str, auth_path: str) -> None:
        sa_token = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        with open(sa_token) as f:
            jwt = f.read().strip()
        client.auth.kubernetes.login(role=role, jwt=jwt, mount_point=auth_path)


    def _build_client(vault_cfg: dict, logger: logging.Logger) -> hvac.Client:
        address = vault_cfg.get("address", "")
        namespace = vault_cfg.get("namespace") or None
        role = vault_cfg.get("kubernetes_role", "")
        auth_path = vault_cfg.get("kubernetes_auth_path", "kubernetes")
        verify = vault_cfg.get("verify", True)
        logger.info("Authenticating to Vault at %s (role=%s, auth_path=%s)", address, role, auth_path)
        client = hvac.Client(url=address, namespace=namespace, verify=verify)
        _k8s_login(client, role, auth_path)
        if not client.is_authenticated():
            raise RuntimeError("Vault authentication failed")
        logger.info("Vault authentication successful")
        return client


    def _read_kv(
        client: hvac.Client,
        mount: str,
        path: str,
        logger: logging.Logger,
        kv_version: "int | None" = None,
    ) -> dict:
        """Read a KV secret.

        kv_version:
        - 1: force KV v1
        - 2: force KV v2
        - None: auto-detect (try v2, then v1)
        """
        if kv_version == 1:
            resp = client.secrets.kv.v1.read_secret(path=path, mount_point=mount)
            logger.debug("Read KV v1 secret at %s/%s (forced)", mount, path)
            return resp["data"]

        if kv_version == 2:
            resp = client.secrets.kv.v2.read_secret_version(
                path=path, mount_point=mount, raise_on_deleted_version=True
            )
            logger.debug("Read KV v2 secret at %s/%s (forced)", mount, path)
            return resp["data"]["data"]

        try:
            resp = client.secrets.kv.v2.read_secret_version(
                path=path, mount_point=mount, raise_on_deleted_version=True
            )
            logger.debug("Read KV v2 secret at %s/%s", mount, path)
            return resp["data"]["data"]
        except Exception:
            pass
        resp = client.secrets.kv.v1.read_secret(path=path, mount_point=mount)
        logger.debug("Read KV v1 secret at %s/%s", mount, path)
        return resp["data"]


    def _write_secret(
        data: dict,
        container_path: Path,
        output_file: str,
        secret_mode: str,
        logger: logging.Logger,
        flatten_to: "Path | None" = None,
    ) -> None:
        container_path.mkdir(parents=True, exist_ok=True)
        if secret_mode == "directory":
            secret_dir = container_path / output_file
            secret_dir.mkdir(parents=True, exist_ok=True)
            for key, val in data.items():
                _atomic_write(secret_dir / key, str(val))
            logger.info("Wrote %d key(s) to %s/", len(data), secret_dir)
            if flatten_to is not None:
                flatten_to.mkdir(parents=True, exist_ok=True)
                for key, val in data.items():
                    _atomic_write(flatten_to / key, str(val))
                logger.info("Flattened %d key(s) to %s/", len(data), flatten_to)
        elif secret_mode == "file":
            content = str(next(iter(data.values()))) if len(data) == 1 else json.dumps(data, indent=2)
            _atomic_write(container_path / output_file, content)
            logger.info("Wrote secret to %s", container_path / output_file)
        elif secret_mode == "aws-credential":
            access_key = _first_present(
                data,
                ["AWS_ACCESS_KEY_ID", "aws_access_key_id", "access_key_id", "access_key"],
            )
            secret_key = _first_present(
                data,
                ["AWS_SECRET_ACCESS_KEY", "aws_secret_access_key", "secret_access_key", "secret_key"],
            )
            session_token = _first_present(
                data,
                ["AWS_SESSION_TOKEN", "aws_session_token", "session_token", "security_token"],
            )
            region = _first_present(data, ["AWS_REGION", "aws_region", "region"])
            ttl = _first_present(data, ["TTL", "ttl", "credential_ttl"])

            if not access_key or not secret_key:
                logger.warning(
                    "aws-credential mode for %s requires access and secret keys; skipping",
                    output_file,
                )
                return

            safe_secret_name = re.sub(r"[^A-Za-z0-9._-]+", "_", output_file)
            var_suffix = re.sub(r"[^A-Za-z0-9_]", "_", safe_secret_name).upper()
            profile = os.environ.get("AWS_PROFILE", "default")

            creds_dir = container_path / ".aws" / safe_secret_name
            creds_path = creds_dir / "credentials"
            lines = [
                f"[{profile}]",
                f"aws_access_key_id={access_key}",
                f"aws_secret_access_key={secret_key}",
            ]
            if session_token:
                lines.append(f"aws_session_token={session_token}")
            if region:
                lines.append(f"region={region}")

            _atomic_write(creds_path, "\n".join(lines) + "\n")
            logger.info("Wrote AWS credentials to %s", creds_path)

            # Per-secret discovery files for startup scripts.
            _atomic_write(container_path / f"AWS_SHARED_CREDENTIALS_FILE_{var_suffix}", str(creds_path))
            if region:
                _atomic_write(container_path / f"AWS_REGION_{var_suffix}", region)
            if ttl:
                _atomic_write(container_path / f"AWS_CREDENTIAL_TTL_{var_suffix}", ttl)

            # Backward-compatible generic defaults (first writer wins).
            shared_file_default = container_path / "AWS_SHARED_CREDENTIALS_FILE"
            region_default = container_path / "AWS_REGION"
            ttl_default = container_path / "AWS_CREDENTIAL_TTL"
            if not shared_file_default.exists():
                _atomic_write(shared_file_default, str(creds_path))
            if region and not region_default.exists():
                _atomic_write(region_default, region)
            if ttl and not ttl_default.exists():
                _atomic_write(ttl_default, ttl)
        else:
            logger.warning("Unknown secretMode '%s' for %s — skipping", secret_mode, output_file)


    def sync_all(client: hvac.Client, config: dict, logger: logging.Logger) -> None:
        base_path = Path(config.get("secrets_base_path", "/opt/nifi/secrets"))
        errors = 0
        for entry in config.get("kvs") or []:
            mount = entry.get("mount", "")
            secret_path = entry.get("secret_path", "")
            output_file = entry.get("output_file") or Path(secret_path).name
            secret_mode = entry.get("secretMode", "directory")
            kv_version_raw = entry.get("kv_version")
            kv_version = None
            if kv_version_raw not in (None, ""):
                try:
                    kv_version = int(kv_version_raw)
                except (TypeError, ValueError):
                    logger.warning(
                        "Invalid kv_version '%s' for %s/%s; auto-detecting KV engine.",
                        kv_version_raw,
                        mount,
                        secret_path,
                    )
                    kv_version = None

            if kv_version not in (None, 1, 2):
                logger.warning(
                    "Unsupported kv_version '%s' for %s/%s; auto-detecting KV engine.",
                    kv_version,
                    mount,
                    secret_path,
                )
                kv_version = None

            # aws-credential secrets default to KV v1 unless explicitly overridden.
            if kv_version is None and secret_mode == "aws-credential":
                kv_version = 1

            container_path = Path(entry.get("containerPath") or str(base_path))
            flatten_raw = entry.get("flattenTo")
            flatten_to = Path(flatten_raw) if flatten_raw else None

            if not mount or not secret_path:
                logger.warning("Skipping entry missing mount or secret_path: %s", entry)
                continue

            logger.info("Fetching %s / %s", mount, secret_path)
            try:
                data = _read_kv(client, mount, secret_path, logger, kv_version)
                _write_secret(data, container_path, output_file, secret_mode, logger, flatten_to)
            except Exception as exc:
                logger.error("Error syncing %s/%s: %s", mount, secret_path, exc)
                errors += 1

        if errors:
            logger.warning("%d secret(s) failed to sync.", errors)


    def _write_health(healthy: bool) -> None:
        Path("/tmp/vault-sync-healthy").write_text("ok" if healthy else "error")


    def main() -> None:
        config_path = os.environ.get("CONFIG_FILE", "/etc/vault-sidecar/config.yaml")
        config = load_config(config_path)
        logger = setup_logging(config.get("log_level") or "INFO")
        logger.info("vault-sync starting (config: %s)", config_path)

        vault_cfg = config.get("vault", {})
        sync_cfg = config.get("sync", {})
        interval_minutes = int(sync_cfg.get("interval_minutes", 10))

        client = None
        while True:
            try:
                if client is None or not client.is_authenticated():
                    client = _build_client(vault_cfg, logger)
                sync_all(client, config, logger)
                _write_health(True)
            except Exception as exc:
                logger.error("Sync cycle failed: %s", exc)
                _write_health(False)
                client = None  # force re-auth on next iteration

            if sync_cfg.get("mode") != "interval":
                logger.info("sync.mode != interval — exiting after one run.")
                break
            logger.info("Next sync in %d minute(s).", interval_minutes)
            time.sleep(interval_minutes * 60)


    if __name__ == "__main__":
        main()

{{- end }}
#END if using VSO

