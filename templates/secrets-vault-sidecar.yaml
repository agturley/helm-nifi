{{- $root := . -}}
{{- $vals := $root.Values.VaultNiFiSecrets -}}
#if using VSO
{{- if and $vals.enabled ( eq $vals.secretProvider "vaultSidecar") -}}
{{- /* Resolve globals (new keys preferred, fall back to legacy) */ -}}
{{- $globalMount := or $vals.defaultMount $vals.mount -}}
{{- $globalNamespace := or $vals.defaultNamespace $vals.namespace -}}
{{- $globalRole := or $vals.defaultRole $vals.role -}}
{{- $globalPath := or $vals.defaultPath $vals.path -}}
{{- $globalAuthPath := or $vals.defaultAuthPath $vals.authPath -}}
{{- /* Ensure we have a non-empty role key for naming — use 'default' if global role empty */ -}}
{{- $globalRoleKey := default "default" $globalRole -}}

{{- /* 1) Build set of unique role keys to render VaultAuths for (include the global roleKey) */ -}}
{{- $roleSet := dict -}}
{{- $roleSet = set $roleSet $globalRoleKey true -}}

---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ $root.Release.Namespace }}
  name: vault-sidecar-config
data:
  config.yaml: |
    app_identifier: "{{ template "apache-nifi.fullname" $ }}-vault-sync"
    secrets_base_path: {{ $vals.defaultContainerPath }}
    log_level: {{ $vals.logLevel}}
    vault:
      address: {{ $vals.defaultSecretAddress}}
      kubernetes_role: {{ $globalRole }}
      kubernetes_auth_path: {{ $globalAuthPath}}
      namespace: {{ $globalNamespace}}
    kvs:
{{- range $secret := $vals.secrets }}
    - mount: {{ default $globalMount $secret.mount }}
      secret_path: {{ if $secret.path }}{{ printf "%s/%s" $secret.path $secret.name }}{{ else }}{{ printf "%s/%s" $globalPath $secret.name }}{{ end }}
      output_file: {{ $secret.name }}
      secretMode: {{ if eq (default $vals.defaultSecretMode $secret.secretMode) "env" }}directory{{ else }}{{ default $vals.defaultSecretMode $secret.secretMode }}{{ end }}
      containerPath: {{ $vals.defaultContainerPath }}
{{- end }}
    sync:
      mode: {{ $vals.vaultSidecar.syncMode }}
      interval_minutes: {{ $vals.vaultSidecar.syncInterval }}
{{- if and $vals.enabled $vals.vaultSidecar.logging }}
    output:
      kafka:
        restproxy_url: {{ $vals.vaultSidecar.restproxy_url | quote }}
        topic: {{ $vals.vaultSidecar.topic | quote }}
        acks: "1"
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: secret-env-script
data:
  generate-env.sh: |
    #!/bin/sh
    set -eu
    OUT="/tmp/env.sh"
    : > "$OUT"
    umask 077

    sanitize() {
      echo "$1" | awk '{print toupper($0)}' | sed -E 's/[^A-Z0-9]+/_/g' | sed -E 's/^_+|_+$//g'
    }

    write_export() {
      VARNAME="$1"
      VAL_RAW="$2"
      ESCAPED=$(printf '%s' "$VAL_RAW" | sed "s/'/'\"'\"'/g")
      printf "export %s='%s'\n" "$VARNAME" "$ESCAPED" >> "$OUT"
    }

    trim() {
      # remove leading/trailing whitespace
      # POSIX-compatible
      printf '%s' "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'
    }

    if [ "$#" -eq 0 ]; then
      >&2 echo "no secret directories provided"
      exit 0
    fi

    for ARG in "$@"; do
      # split into name and path (on first ::)
      SECRET_NAME=$(printf '%s' "$ARG" | awk -F '::' '{print $1}')
      SECRET_DIR_ARG=$(printf '%s' "$ARG" | awk -F '::' '{ $1=""; sub(/^::/, ""); print $0 }')

      # trim whitespace
      SECRET_NAME=$(trim "$SECRET_NAME")
      SECRET_DIR_ARG=$(trim "$SECRET_DIR_ARG")

      if [ -z "$SECRET_NAME" ] || [ -z "$SECRET_DIR_ARG" ]; then
        >&2 echo "warning: bad arg (expect name::dir): $ARG"
        continue
      fi

      # Try the path as given first
      if [ -d "$SECRET_DIR_ARG" ]; then
        SECRET_DIR="$SECRET_DIR_ARG"
      else
        >&2 echo "warning: secret directory not found: $SECRET_DIR_ARG"
        continue
      fi

      # iterate files directly under SECRET_DIR (ignore dotfiles)
      for f in "$SECRET_DIR"/*; do
        [ -e "$f" ] || continue
        if [ -f "$f" ]; then
          FNAME=$(basename "$f")
          #if [ "$SECRET_NAME" = "nifi-secrets" ]; then
          VARNAME=$(sanitize "$FNAME")
          #else
          #  VARNAME=$(sanitize "${SECRET_NAME}_${FNAME}")
          #fi

          VAL=$(cat "$f" || true)
          write_export "$VARNAME" "$VAL"
        fi
      done
    done

    chmod 440 "$OUT" || true
    echo "wrote $OUT"

{{- end }}
#END if using VSO

