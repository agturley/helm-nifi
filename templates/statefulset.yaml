{{/*
Container named-template definitions are split into individual files
under templates/statefulset-containers/ for maintainability:

  _container_server.tpl            → nifi.container.server
  _container_s3sync.tpl            → nifi.container.s3sync
  _container_vaultsidecar.tpl   → nifi.container.vaultSidecar
  _container_awssecretssidecar.tpl → nifi.container.awsSecretsSidecar
  _container_logtailers.tpl        → nifi.container.logTailers
  _container_certmanager.tpl       → nifi.container.certManager

Helm loads all .tpl files in templates/ and subdirectories, so all named
templates are globally available with no special wiring required.
*/}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ template "apache-nifi.fullname" . }}
  labels:
{{- include "nifi.commonLabels" . | nindent 4 }}
    role: "nifi-app"
    app: {{ include "apache-nifi.name" . | quote }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}"
    release: {{ .Release.Name | quote }}
    heritage: {{ .Release.Service | quote }}
spec:
  podManagementPolicy: {{ .Values.sts.podManagementPolicy }}
  serviceName: {{ template "apache-nifi.fullname" . }}-headless
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ template "apache-nifi.name" . }}
      release: {{ .Release.Name }}
  template:
    metadata:
      annotations:
{{- if .Values.sts.pod.annotations }}
{{ toYaml .Values.sts.pod.annotations | indent 8 }}
{{- end }}
      labels:
        {{- include "nifi.commonLabels" . | nindent 8 }}
        role: "nifi-app"
        app: {{ include "apache-nifi.name" . | quote }}
        chart: "{{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}"
        release: {{ .Release.Name | quote }}
        heritage: {{ .Release.Service | quote }}
{{- if .Values.extraLabels }}
{{ toYaml .Values.extraLabels | indent 8 }}
{{- end }}
    spec:
{{- if .Values.schedulerName }}
      schedulerName: {{ .Values.schedulerName }}
{{- end }}

{{- if .Values.sts.useHostNetwork }}
      hostNetwork: {{ .Values.sts.useHostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
{{- end }}
{{- if .Values.sts.hostAliases }}
      hostAliases:
{{ toYaml .Values.sts.hostAliases | indent 8 }}
{{- end }}
      serviceAccountName: {{ include "apache-nifi.serviceAccountName" . }}
      {{- $builtinAff := dict -}}
      {{- if eq .Values.sts.AntiAffinity "hard" -}}
        {{- $matchExpr := dict "key" "app" "operator" "In" "values" (list (include "apache-nifi.name" .)) -}}
        {{- $lsel := dict "matchExpressions" (list $matchExpr) -}}
        {{- $term := dict "labelSelector" $lsel "topologyKey" "kubernetes.io/hostname" -}}
        {{- $antiAff := dict "requiredDuringSchedulingIgnoredDuringExecution" (list $term) -}}
        {{- $builtinAff = dict "podAntiAffinity" $antiAff -}}
      {{- else if eq .Values.sts.AntiAffinity "soft" -}}
        {{- $matchExpr := dict "key" "app" "operator" "In" "values" (list (include "apache-nifi.name" .)) -}}
        {{- $lsel := dict "matchExpressions" (list $matchExpr) -}}
        {{- $patTerm := dict "labelSelector" $lsel "topologyKey" "kubernetes.io/hostname" -}}
        {{- $preferred := dict "weight" 1 "podAffinityTerm" $patTerm -}}
        {{- $antiAff := dict "preferredDuringSchedulingIgnoredDuringExecution" (list $preferred) -}}
        {{- $builtinAff = dict "podAntiAffinity" $antiAff -}}
      {{- end -}}
      {{- $finalAff := mergeOverwrite $builtinAff (.Values.affinity | default dict) -}}
      {{- if $finalAff }}
      affinity:
{{ toYaml $finalAff | indent 8 }}
      {{- end }}
{{- if .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
{{- end }}
{{- if .Values.tolerations }}
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
{{- end }}
{{- if .Values.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
{{- end }}
      securityContext:
{{- if .Values.securityContext }}
{{ toYaml .Values.securityContext | indent 8 }}
{{- else }}
        sysctls:
          - name: net.ipv4.ip_local_port_range
            value: "10000 65000"
{{- end }}
      initContainers:
{{- if and .Values.properties.isNode (ne .Values.zookeeperInit.enabled false) (not .Values.kubernetesClusterState.enabled) }}
      - name: zookeeper
        imagePullPolicy: {{ .Values.images.sidecar.pullPolicy | default "Always" | quote }}
        image: "{{ .Values.images.sidecar.repository }}:{{ .Values.images.sidecar.tag }}"
        resources:
{{- toYaml .Values.zookeeperResources | nindent 10 }}
        command:
        - sh
        - -c
        - |
          echo trying to contact {{ template "zookeeper.server" . }} {{ .Values.zookeeper.port }}
          until nc -vzw 1 {{ template "zookeeper.server" . }} {{ .Values.zookeeper.port }}; do
            echo "waiting for zookeeper..."
            sleep 2
          done
{{- end }}
{{- if .Values.NiFiSync.UserPolicySync.enabled }} 
      - name: nifi-policysync
        imagePullPolicy: {{ .Values.images.nifi.pullPolicy | quote }}
        image: "{{ .Values.images.nifi.repository }}:{{ .Values.images.nifi.tag }}"
        command: ["python3", "/opt/nifi/nifi-sync/scripts/nifi-policysync.py"]
        {{- if .Values.envFrom }}
        # Inherited so INITIAL_ADMIN_IDENTITY can come from the same Secret the
        # other containers read, rather than having to be restated in values.yaml.
        envFrom:
{{ toYaml .Values.envFrom | indent 10 }}
        {{- end }}
        env:
          - name: RESET_AUTH_FILES
            value: {{ .Values.NiFiSync.UserPolicySync.resetAuthFiles | default false | quote }}
          # Deliberately NOT named INITIAL_ADMIN_IDENTITY: an explicit `env`
          # entry outranks `envFrom` in Kubernetes, so setting that name here
          # would make values.yaml silently beat the Secret. The script treats
          # this purely as a fallback for when nothing else supplies one.
          #
          # It is also sourced from auth.admin alone. It previously used
          # `ternary auth.ldap.admin auth.admin auth.ldap.enabled`, which with
          # LDAP enabled always resolved to the LDAP *bind DN* - an identity no
          # user ever authenticates as under USE_USERNAME - so policysync seeded
          # permissions against an account that could never match.
          - name: INITIAL_ADMIN_IDENTITY_DEFAULT
            value: {{ .Values.auth.admin | default "" | quote }}
          - name: SECRETS_MODE
            value: {{ include "nifi.effectiveSecretsMode" . | quote }}
          - name: SECRETS_PATH
            value: {{ .Values.properties.secretsFilePath | quote }}
          - name: SECRETS_FILE
            value: {{ .Values.properties.secretsFile | default "credentials.env" | quote }}
        resources:
{{ toYaml .Values.syncresources | indent 10 }}        
        volumeMounts:
          - mountPath: /opt/nifi/nifi-sync/scripts
            name: nifisync-scripts
          - mountPath: /opt/nifi/data
            {{- if and .Values.persistence.enabled .Values.persistence.subPath.enabled (not .Values.persistence.dataStorage.DisallowSubPath) }}
            name: {{ .Values.persistence.subPath.name }}
            subPath: data
            {{- else }}
            name: "data"
            {{- end }}
          - mountPath: /opt/nifi/nifi-current/auth-conf/
            {{- if and .Values.persistence.enabled .Values.persistence.subPath.enabled (not .Values.persistence.authconfStorage.DisallowSubPath) }}
            name: {{ .Values.persistence.subPath.name }}
            subPath: auth-conf
            {{- else }}
            name: "auth-conf"
            {{- end }}
          {{- $vaultOwnsSecretsPath := and .Values.VaultNiFiSecrets.enabled (eq (default "" .Values.VaultNiFiSecrets.secretProvider) "vaultSidecar") }}
          {{- if and .Values.properties.secretsName (ne (include "nifi.effectiveSecretsMode" .) "none") (not $vaultOwnsSecretsPath) }}
          - name: k8s-secrets
            mountPath: {{ .Values.properties.secretsFilePath }}
            readOnly: true
          {{- end }}
        
{{- end }}
{{- $vals := .Values.VaultNiFiSecrets }}

{{- if .Values.persistence.enabled }}
      - name: create-custom-dir
        imagePullPolicy: {{ .Values.images.sidecar.pullPolicy | default "Always" | quote }}
        image: "{{ .Values.images.sidecar.repository }}:{{ .Values.images.sidecar.tag }}"
        resources:
{{ toYaml .Values.logresources | indent 10 }}
        command:
        - sh
        - -c
        - |
          mkdir -p /opt/nifi/data/custom
        volumeMounts:
          - mountPath: /opt/nifi/data
            {{- if and .Values.persistence.enabled .Values.persistence.subPath.enabled (not .Values.persistence.dataStorage.DisallowSubPath) }}
            name: {{ .Values.persistence.subPath.name }}
            subPath: data
            {{- else }}
            name: "data"
            {{- end }}
{{- end }}

{{- range $key, $value := .Values.initContainers }}
      - name: {{ $key }}
{{ toYaml $value | indent 8 }}
{{- end }}
{{- $vaultVals := .Values.VaultNiFiSecrets -}}
{{- $vaultCaSecrets := .Values.caSecrets -}}
{{- $vaultCaSecretName := default "" $vaultVals.vaultSidecar.caSecretName -}}
{{- if and (eq $vaultCaSecretName "") (gt (len $vaultCaSecrets) 0) -}}
{{- $vaultCaSecretName = index $vaultCaSecrets 0 -}}
{{- end -}}
{{- if ne $vaultCaSecretName "" }}
      - name: prepare-ca-bundle
        image: {{ .Values.images.utility.repository }}:{{ .Values.images.utility.tag }}
        imagePullPolicy: {{ .Values.images.utility.pullPolicy | quote }}
        command: ["/bin/sh", "-ec"]
        args:
          - |
            set -e
            out=/work/ca-bundle.pem
            : > "$out"
            {{- if .Values.NiFiSync.s3Sync.enabled }}
            merged=/merged-certs/ca-bundle.crt
            : > "$merged"
            # Try RHEL/UBI then Debian/Alpine system CA paths
            for system_ca in /etc/pki/tls/certs/ca-bundle.crt /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem /etc/ssl/certs/ca-certificates.crt; do
              if [ -f "$system_ca" ]; then
                cat "$system_ca" >> "$merged"
                printf '\n' >> "$merged"
                echo "Added system CA bundle from $system_ca"
                break
              fi
            done
            {{- end }}
            found=0
            for file in /input/*; do
              [ -f "$file" ] || continue
              case "$file" in
                *.crt|*.cer|*.pem)
                  cat "$file" >> "$out"
                  printf '\n' >> "$out"
                  {{- if .Values.NiFiSync.s3Sync.enabled }}
                  cat "$file" >> "$merged"
                  printf '\n' >> "$merged"
                  {{- end }}
                  found=1
                  ;;
              esac
            done
            if [ "$found" -eq 0 ]; then
              echo "No CA files found in /input" >&2
              exit 1
            fi
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
          - name: ca-secret-files
            mountPath: /input
            readOnly: true
          - name: vault-ca-bundle
            mountPath: /work
          {{- if .Values.NiFiSync.s3Sync.enabled }}
          - name: merged-ca-bundle
            mountPath: /merged-certs
          {{- end }}
{{- end }}
      {{- $pullSecrets := list -}}
      {{- if .Values.images.nifi.pullSecret }}{{- $pullSecrets = append $pullSecrets .Values.images.nifi.pullSecret }}{{- end }}
      {{- if .Values.images.utility.pullSecret }}{{- $pullSecrets = append $pullSecrets .Values.images.utility.pullSecret }}{{- end }}
      {{- if $pullSecrets }}
      imagePullSecrets:
        {{- range $pullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
{{- if .Values.extraContainers }}
{{- range .Values.extraContainers }}
      - name: {{ .name }}
        image: {{ .image }}
        {{- if .command }}
        command:
          {{- toYaml .command | nindent 10 }}
        {{- end }}
        {{- if .args }}
        args:
          {{- toYaml .args | nindent 10 }}
        {{- end }}
        {{- if .ports }}
        ports:
          {{- toYaml .ports | nindent 10 }}
        {{- end }}
        {{- if .env }}
        env:
          {{- toYaml .env | nindent 10 }}
        {{- end }}
        {{- if .envFrom }}
        envFrom:
          {{- toYaml .envFrom | nindent 10 }}
        {{- end }}
        {{- if .volumeMounts }}
        volumeMounts:
          {{- toYaml .volumeMounts | nindent 10 }}
        {{- end }}
        {{- if .securityContext }}
        securityContext:
          {{- toYaml .securityContext | nindent 10 }}
        {{- end }}
        resources:
          {{- $defaults := $.Values.extraContainerResources | default (dict) -}}
          {{- $overrides := .resources | default (dict) -}}
          {{- merge $overrides $defaults | toYaml | nindent 10 }}
{{- end }}
{{- end }}
{{ include "nifi.container.server" . }}
{{- if .Values.NiFiSync.s3Sync.enabled }}
{{ include "nifi.container.s3sync" . }}
{{- end }}
{{- $vals := .Values.VaultNiFiSecrets }}
{{- if and $vals.enabled (eq (default "" $vals.secretProvider) "vaultSidecar") }}
{{ include "nifi.container.vaultSidecar" . }}
{{- end }}
{{- if .Values.awsSecretsSync.enabled }}
{{ include "nifi.container.awsSecretsSidecar" . }}
{{- end }}
{{ include "nifi.container.logTailers" . }}
{{- if .Values.certManager.enabled }}
{{ include "nifi.container.certManager" . }}
{{- end }}
{{ include "nifi.statefulset.volumes" . }}
