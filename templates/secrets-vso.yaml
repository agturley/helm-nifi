{{- $root := . -}}
{{- $vals := $root.Values.VaultNiFiSecrets -}}
{{- /* ============================= */ -}}
{{- /*  VALIDATE LEGACY PATH USAGE   */ -}}
{{- /* ============================= */ -}}

{{- if and $vals.enabled (eq $vals.secretProvider "vaultSecretOperator") }}

  {{- $globalPath := or $vals.defaultPath $vals.path | default "" -}}

  {{- range $i, $entry := $vals.secrets }}
    {{- $name := "" -}}
    {{- $path := $globalPath -}}

    {{- if eq (kindOf $entry) "string" }}
      {{- $name = $entry -}}
    {{- else }}
      {{- $name = default "" $entry.name -}}
      {{- $path = default $globalPath $entry.path -}}
    {{- end }}

    {{- $nameClean := trimPrefix "/" $name -}}
    {{- $pathClean := trimSuffix "/" (trimPrefix "/" $path) -}}

    {{- if and $nameClean (contains (printf "/%s" $nameClean) (printf "/%s" $pathClean)) }}
      {{- fail (printf "Invalid VaultNiFiSecrets configuration: Vault path '%s' includes secret name '%s'.\n\nThis chart now appends the secret name automatically.\n\nFIX:\n  Change:\n    path: \"%s\"\n  To:\n    path: \"%s\"\n\nSecret: %s" $path $nameClean $path (trimSuffix (printf "/%s" $nameClean) $path) $nameClean) -}}
    {{- end }}
  {{- end }}

{{- end }}

{{- /* ============================= */ -}}
{{- /*  END VALIDATION BLOCK         */ -}}
{{- /* ============================= */ -}}

#if using VSO
{{- if and $vals.enabled ( eq $vals.secretProvider "vaultSecretOperator") -}}
{{- /* Resolve globals (new keys preferred, fall back to legacy) */ -}}
{{- $globalMount := or $vals.defaultMount $vals.mount -}}
{{- $globalNamespace := or $vals.defaultNamespace $vals.namespace -}}
{{- $globalRole := or $vals.defaultRole $vals.role -}}
{{- $globalPath := or $vals.defaultPath $vals.path -}}

{{- /* Ensure we have a non-empty role key for naming — use 'default' if global role empty */ -}}
{{- $globalRoleKey := default "default" $globalRole -}}

{{- /* 1) Build set of unique role keys to render VaultAuths for (include the global roleKey) */ -}}
{{- $roleSet := dict -}}
{{- $roleSet = set $roleSet $globalRoleKey true -}}

{{- range $i, $entry := $vals.secrets }}
  {{- if ne (kindOf $entry) "string" }}
    {{- $r := default "" $entry.role -}}
    {{- if ne $r "" }}
      {{- $roleSet = set $roleSet $r true -}}
    {{- end }}
  {{- end }}
{{- end }}

{{- /* 2) Render a VaultAuth for every roleKey (sorted for deterministic output) */ -}}
{{- range $idx, $role := sortAlpha (keys $roleSet) }}
  {{- /* roleNameKey is non-empty string; sanitize for k8s resource name */ -}}
  {{- $roleKeySafe := include "secret.sanitizeName" (default "default" $role) -}}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vaultauth-{{ $globalMount }}-{{ $roleKeySafe }}
  namespace: {{ $root.Release.Namespace }}
spec:
  namespace: {{ $globalNamespace }}
  method: kubernetes
  mount: {{ $globalMount }}
  kubernetes:
    role: {{ $role }}
    serviceAccount: default
---
{{- end }}

{{- /* 3) Render VaultStaticSecret resources; assign vaultAuthRef based on effective role */ -}}
{{- range $i, $entry := $vals.secrets }}
  {{- /* Build mutable ctx so we can support string OR object forms */ -}}
  {{- $ctx := dict "name" "" "mount" $globalMount "path" $globalPath "role" $globalRole -}}

  {{- if eq (kindOf $entry) "string" }}
    {{- $ctx = set $ctx "name" $entry -}}
  {{- else }}
    {{- $ctx = set $ctx "name" (default "" $entry.name) -}}
    {{- $ctx = set $ctx "mount" (default $globalMount $entry.mount) -}}
    {{- $ctx = set $ctx "path" (default $globalPath $entry.path) -}}
    {{- if ne (default "" $entry.role) "" }}
      {{- $ctx = set $ctx "role" $entry.role -}}
    {{- end }}
  {{- end }}

  {{- /* read */ -}}
  {{- $name := $ctx.name -}}
  {{- $mount := $ctx.mount -}}
  {{- $path := $ctx.path -}}
  {{- $roleForSecret := default $globalRole $ctx.role -}}
  {{- $roleKeyForSecret := default "default" $roleForSecret -}}

  {{- /* normalize & sanitize */ -}}
  {{- $nameClean := trimPrefix "/" $name -}}
  {{- $mountClean := trimSuffix "/" $mount -}}
  {{- $pathClean := trimSuffix "/" (trimPrefix "/" $path) -}}
  {{- $joinedPath := printf "%s/%s" $pathClean $nameClean -}}
  {{- $safeName := include "secret.sanitizeName" $nameClean -}}
  {{- $roleKeySafe := include "secret.sanitizeName" $roleKeyForSecret -}}

  {{- /* vaultAuthRef name for this secret */ -}}
  {{- $vaultAuthRef := printf "vaultauth-%s-%s" $globalMount $roleKeySafe -}}

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vault-{{ $safeName }}
  namespace: {{ $root.Release.Namespace }}
spec:
  type: kv-v2
  mount: {{ $mountClean }}
  path: {{ $joinedPath }}
  destination:
    transformation:
      excludeRaw: true
    name: vault-{{ $safeName }}
    create: true
  refreshAfter: 30m
  vaultAuthRef: {{ $vaultAuthRef }}
---
{{- end }}
#END if using VSO




{{- end }}