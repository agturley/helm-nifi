{{if or .Values.NiFiSync.s3Sync.enabled .Values.NiFiSync.UserPolicySync.enabled}}
# Create Sync Scripts
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "apache-nifi.fullname" . }}-nifisync-scripts
  namespace: {{ .Values.namespace }}
data:
{{ if .Values.NiFiSync.UserPolicySync.enabled }}
  nifi-policysync.py: |
    #!/usr/bin/env python3
    """
    Sync NiFi users.xml and authorizations.xml with optional managed and external LDAP groups.
    
    Features:
      1. ENABLE_MANAGED_GROUPS: skip or include built-in managed groups
      2. Custom monitoring user with read-only access (env MONITORING_USER)
      3. Node users generated per REPLICA_COUNT, or a single shared identity when
         shared node identity mapping is enabled (SHARED_NODE_IDENTITY)
      4. External LDAP groups granted roles via the `external_group_roles` mapping without creating entries in users.xml

    Tracks dropped external groups in `external_groups.json` and removes their policies.
    """
    from __future__ import annotations
    import gzip
    import json
    import os
    import uuid
    import hashlib
    import shutil
    import xml.etree.ElementTree as ET
    from pathlib import Path
    from xml.dom import minidom
    from datetime import datetime
    import logging

    # Configure basic logging at DEBUG to capture LDAP-group steps
    logging.basicConfig(format='[%(levelname)s] %(message)s', level=logging.DEBUG)

    # Default paths
    NIFI_HOME = Path(os.getenv("NIFI_HOME", "/opt/nifi/nifi-current"))
    CONF_DIR = Path(os.getenv("CONF_DIR", "/opt/nifi/data"))

    # Load credentials from the configured secrets source so INITIAL_ADMIN_IDENTITY,
    # and any other relevant vars, are available regardless of secretsMode.
    _secrets_mode = os.getenv("SECRETS_MODE", "none").strip().lower()
    _secrets_path = os.getenv("SECRETS_PATH", "/opt/nifi/secrets").strip()
    _secrets_file = os.getenv("SECRETS_FILE", "credentials.env").strip()
    if _secrets_mode == "directory":
        for _key in ("INITIAL_ADMIN_IDENTITY", "LDAP_MANAGER_DN", "LDAP_MANAGER_PASSWORD"):
            _fpath = Path(_secrets_path) / _key
            if _fpath.exists():
                _val = _fpath.read_text().strip()
                if _val:
                    os.environ[_key] = _val
                    logging.debug(f"Loaded {_key} from {_fpath}")
    elif _secrets_mode == "singlefile":
        _envfile = Path(_secrets_path) / _secrets_file
        if _envfile.exists():
            for _line in _envfile.read_text().splitlines():
                _line = _line.strip()
                if not _line or _line.startswith("#") or "=" not in _line:
                    continue
                _k, _v = _line.split("=", 1)
                _k, _v = _k.strip(), _v.strip()
                if _k and _k not in os.environ:
                    os.environ[_k] = _v
                    logging.debug(f"Loaded {_k} from {_envfile}")
    # (none mode: env vars are set by Helm values via the container env: block)
    BACKUP_DIR = NIFI_HOME / "auth-conf" / "backup"
    USERS_XML_PATH = NIFI_HOME / "auth-conf/users.xml"
    AUTH_XML_PATH = NIFI_HOME / "auth-conf/authorizations.xml"
    FLOW_JSON_GZ_PATH = CONF_DIR / "flow.json.gz"
    ROOT_PGID_CACHE = NIFI_HOME / "auth-conf/rootpgid"
    GROUP_TRACK_FILE  = NIFI_HOME / "auth-conf" / "nifi-sync_external_groups.json"
    USER_TRACK_FILE   = NIFI_HOME / "auth-conf" / "nifi-sync_managed_users.json"
    ADMIN_TRACK_FILE  = NIFI_HOME / "auth-conf" / "nifi-sync_initial_admin.txt"

    # Track per-file changes
    changed_users = False
    changed_auth  = False

    # Environment-configurable flags
    ENABLE_MANAGED_GROUPS = os.getenv("ENABLE_MANAGED_GROUPS", "true").lower() in ("1", "true", "yes")
    MONITORING_USER = 'CN={{ template "apache-nifi.fullname" $ }}-monitor{{ include "nifi.nodeOU" $ }}'
    REPLICA_COUNT = {{ .Values.replicaCount }}
    NODE_USER_TEMPLATE = 'CN={{ include "nifi.nodeCN" (dict "ctx" $ "node" "{i}") }}{{ include "nifi.nodeOU" $ }}'
    {{- if eq (include "nifi.sharedNodeIdentityMappingEnabled" .) "true" }}
    # Shared identity used by all nodes after cert-manager identity mapping.
    # Must match nifi.security.identity.mapping.value.nifi_nodes in nifi.properties.
    SHARED_NODE_IDENTITY = '{{ include "nifi.sharedNodeIdentity" . }}'
    {{- else }}
    SHARED_NODE_IDENTITY = None
    {{- end }}

    # Namespace for deterministic UUID5
    default_namespace = uuid.uuid5(uuid.NAMESPACE_DNS, "nifi-sync")

    # Managed LDAP groups and default group->role mapping from Helm values
    {{- $mgr := .Values.NiFiSync.UserPolicySync.managedGroupRoles }}
    managed_groups = {
    {{- range $grp, $role := $mgr }}
        "{{ $grp }}": [],
    {{- end }}
    }
    managed_group_roles = {
    {{- range $grp, $role := $mgr }}
        "{{ $grp }}": "{{ $role }}",
    {{- end }}
    }

    # Managed internal NiFi users from Helm values
    managed_users = [
    {{- range $user := .Values.NiFiSync.UserPolicySync.managedUsers }}
        "{{ $user }}",
    {{- end }}
    ]

    # Ensure managed internal NiFi users exist and track them
    def apply_managed_users(root, ids_map, tracker_set):
        for usr in managed_users:
            uid = ensure_user(root, usr, ids_map)
            tracker_set.add(usr)

    # Mapping of managed users to groups from Helm values
    managed_user_groups = {
    {{- range $user, $groups := .Values.NiFiSync.UserPolicySync.managedUserGroups }}
        "{{ $user }}": [
        {{- range $idx, $grp := $groups }}"{{ $grp }}"{{ if not (eq (add $idx 1) (len $groups)) }}, {{ end }}
        {{- end }}],
    {{- end }}
    }

    # Role privileges mapping
    role_privileges = {
        "monitoring": [
            # existing system-wide
            ("R", "/flow"),
            # read on root PG and its children
            ("R", "/process-groups/ROOT_PG"),
            ("R", "/data/process-groups/ROOT_PG"),
        ],
        "ro": [
          # existing system-wide privileges
          ("R", "/flow"),
          ("R", "/tenants"),
          ("R", "/policies"),
          ("R", "/controller"),
          ("R", "/provenance"),
          ("R", "/site-to-site"), ("R", "/system"),
          ("R", "/counters"),
          # read on root PG and its children
          ("R", "/process-groups/ROOT_PG"),
          ("R", "/provenance-data/process-groups/ROOT_PG"),
          ("R", "/data/process-groups/ROOT_PG"),
        ],
        "rw": [
            # existing system-wide privileges
            ("R", "/flow"), ("W", "/restricted-components"),
            ("R", "/tenants"),
            ("R", "/policies"),
            ("R", "/controller"), ("W", "/controller"), 
            ("R", "/provenance"), ("W", "/provenance"), 
            ("R", "/site-to-site"), ("R", "/system"), 
            ("R", "/counters"), ("W", "/counters"),
            # read/write on root PG and its children
            ("R", "/process-groups/ROOT_PG"), ("W", "/process-groups/ROOT_PG"),
            ("W", "/operation/process-groups/ROOT_PG"), ("R", "/provenance-data/process-groups/ROOT_PG"),
            ("R", "/data/process-groups/ROOT_PG"), ("W", "/data/process-groups/ROOT_PG"),
        ],
        "admin": [
          # existing system-wide privileges
          ("R", "/flow"), ("W", "/restricted-components"),
          ("R", "/tenants"), ("W", "/tenants"),
          ("R", "/policies"), ("W", "/policies"), 
          ("R", "/controller"), ("W", "/controller"), 
          ("R", "/provenance"), ("W", "/provenance"), 
          ("R", "/site-to-site"), ("R", "/system"), 
          ("R", "/counters"), ("W", "/counters"),
          # read/write on root PG and its children
          ("R", "/process-groups/ROOT_PG"), ("W", "/process-groups/ROOT_PG"),
          ("W", "/operation/process-groups/ROOT_PG"), ("R", "/provenance-data/process-groups/ROOT_PG"),
          ("R", "/data/process-groups/ROOT_PG"), ("W", "/data/process-groups/ROOT_PG"),
        ]
    }
    # External LDAP group->role mapping (customize here)
    external_group_roles = {
      {{- range $grp, $role := .Values.NiFiSync.UserPolicySync.externalGroupRoles }}
          "{{ $grp }}": "{{ $role }}",
      {{- end }}
    }

    # Helper functions at module scope
    def generate_group_uuid(name: str) -> str:
        digest = hashlib.md5(name.encode('utf-8')).digest()
        b = bytearray(digest)
        b[6] = (b[6] & 0x0F) | (3 << 4)
        b[8] = (b[8] & 0x3F) | 0x80
        return str(uuid.UUID(bytes=bytes(b)))

    def generate_id(kind: str, name: str, namespace: uuid.UUID = default_namespace) -> str:
        return str(uuid.uuid5(namespace, f"{kind}:{name}"))

    def prettify(elem: ET.Element) -> str:
        rough = ET.tostring(elem, 'utf-8')
        reparsed = minidom.parseString(rough)
        pretty = reparsed.toprettyxml(indent="  ")
        return "\n".join([line for line in pretty.splitlines() if line.strip()])

    def strip_namespaces(root: ET.Element) -> None:
        for el in root.iter():
            if isinstance(el.tag, str) and "}" in el.tag:
                el.tag = el.tag.split("}", 1)[1]

    def get_root_pg_id() -> str | None:
        if ROOT_PGID_CACHE.exists():
            pgid = ROOT_PGID_CACHE.read_text().strip()
            if pgid:
                return pgid
        if not FLOW_JSON_GZ_PATH.exists():
            logging.warning("flow.json.gz not found – cannot resolve root process group ID")
            return None
        with gzip.open(FLOW_JSON_GZ_PATH, "rt", encoding="utf-8") as fh:
            data = json.load(fh)
            pgid = data.get("rootGroup", {}).get("instanceIdentifier")
            if pgid:
                ROOT_PGID_CACHE.write_text(pgid)
            return pgid

    def load_users_xml():
        if USERS_XML_PATH.exists():
            tree = ET.parse(USERS_XML_PATH)
            root = tree.getroot()
            strip_namespaces(root)

            # Consolidate multiple <users> elements into one — caused by the
            # empty-element-is-falsy bug where `root.find("users") or
            # ET.SubElement(...)` created a new wrapper for every user.
            all_users_elems = root.findall("users")
            if len(all_users_elems) > 1:
                primary = all_users_elems[0]
                for extra in all_users_elems[1:]:
                    for child in list(extra):
                        primary.append(child)
                    root.remove(extra)
                logging.warning(
                    f"Consolidated {len(all_users_elems)} <users> elements into one"
                )

            # Normalize element order in case file was written with users before
            # groups (old policysync or NiFi 1.x). tenants.xsd xs:sequence
            # requires <groups> before <users>.
            _g = root.find("groups")
            _u = root.find("users")
            if _g is not None and _u is not None:
                children = list(root)
                if children.index(_u) < children.index(_g):
                    root.remove(_g)
                    root.remove(_u)
                    root.append(_g)
                    root.append(_u)
                    logging.debug("Normalized users.xml: moved <groups> before <users>")
        else:
            root = ET.Element("tenants")
            # NiFi tenants.xsd xs:sequence requires groups before users
            ET.SubElement(root, "groups")
            ET.SubElement(root, "users")
            tree = ET.ElementTree(root)
        return tree, root

    def current_id_maps(root: ET.Element) -> tuple[dict[str,str], dict[str,str]]:
        user_ids, group_ids = {}, {}
        for user in root.findall(".//user"):
            ident = user.attrib.get("identity")
            if ident:
                user_ids[ident] = user.attrib["identifier"]
        for group in root.findall(".//group"):
            name = group.attrib.get("name")
            if name:
                group_ids[name] = group.attrib["identifier"]
        return user_ids, group_ids

    def ensure_user(root: ET.Element, identity: str, user_ids: dict[str,str]) -> str:
        global changed_users
        if identity in user_ids:
            return user_ids[identity]
        users_elem = root.find("users")
        if users_elem is None:
            users_elem = ET.SubElement(root, "users")
        uid = generate_id("user", identity)
        ET.SubElement(users_elem, "user", {"identifier": uid, "identity": identity})
        user_ids[identity] = uid
        changed_users = True
        logging.info(f"Created user '{identity}' ({uid})")
        return uid

    def ensure_group(root: ET.Element, name: str, group_ids: dict[str,str]) -> str:
        global changed_users
        if name in group_ids:
            return group_ids[name]
        groups_elem = root.find("groups")
        if groups_elem is None:
            # Insert groups before users to match NiFi tenants.xsd xs:sequence order
            groups_elem = ET.Element("groups")
            users_elem = root.find("users")
            if users_elem is not None:
                users_idx = list(root).index(users_elem)
                root.insert(users_idx, groups_elem)
            else:
                root.append(groups_elem)
        gid = generate_id("group", name)
        ET.SubElement(groups_elem, "group", {"identifier": gid, "name": name})
        group_ids[name] = gid
        changed_users = True
        logging.info(f"Created group '{name}' ({gid})")
        return gid

    def add_policy(policies_elem: ET.Element, action: str, resource: str,
                   user_ids_to_add: list[str], group_ids_to_add: list[str],
                   user_names_to_add: list[str] = None, group_names_to_add: list[str] = None) -> None:
        global changed_auth
        user_names_to_add = user_names_to_add or []
        group_names_to_add = group_names_to_add or []
        policy = next((p for p in policies_elem.findall("policy") if p.attrib.get("action") == action and p.attrib.get("resource") == resource), None)
        if not policy:
            policy = ET.SubElement(policies_elem, "policy", {"identifier": generate_id("policy", f"{action}:{resource}"), "action": action, "resource": resource})
            changed_auth = True
        existing_gids = {g.attrib["identifier"] for g in policy.findall("group")}
        existing_uids = {u.attrib["identifier"] for u in policy.findall("user")}
        new_gids = set(group_ids_to_add) - existing_gids
        new_uids = set(user_ids_to_add) - existing_uids

        if new_gids or new_uids:
            changed_auth = True
            for name, gid in zip(group_names_to_add, group_ids_to_add):
                if gid in new_gids:
                    logging.info(f"Adding group '{name}' ({gid}) to policy {action}:{resource}")
            for name, uid in zip(user_names_to_add, user_ids_to_add):
                if uid in new_uids:
                    logging.info(f"Adding user '{name}' ({uid}) to policy {action}:{resource}")
            merged_gid_list = sorted(existing_gids.union(group_ids_to_add))
            merged_uid_list = sorted(existing_uids.union(user_ids_to_add))
            for child in list(policy):
                policy.remove(child)
            for gid in merged_gid_list:
                ET.SubElement(policy, "group", {"identifier": gid})
            for uid in merged_uid_list:
                ET.SubElement(policy, "user", {"identifier": uid})

    def load_tracked_groups() -> set[str]:
        if GROUP_TRACK_FILE.exists():
            try:
                return set(json.loads(GROUP_TRACK_FILE.read_text()))
            except Exception:
                logging.warning(f"Could not parse {GROUP_TRACK_FILE}; resetting")
        return set()

    def load_tracked_users() -> set[str]:
        if USER_TRACK_FILE.exists():
            try:
                return set(json.loads(USER_TRACK_FILE.read_text()))
            except Exception:
                logging.warning(f"Could not parse {USER_TRACK_FILE}; resetting")
        return set()

    def save_track(path: Path, items: set[str]) -> None:
        path.write_text(json.dumps(sorted(items), indent=2))

    def main():
        global changed_users, changed_auth
        # initialize tracker set
        current_users: set[str] = set()

        BACKUP_DIR.mkdir(parents=True, exist_ok=True)

        if os.getenv("RESET_AUTH_FILES", "").lower() in ("1", "true", "yes"):
            logging.warning("RESET_AUTH_FILES is set — wiping auth files for a clean slate (debug only)")
            for path in (USERS_XML_PATH, AUTH_XML_PATH, GROUP_TRACK_FILE, USER_TRACK_FILE, ADMIN_TRACK_FILE, ROOT_PGID_CACHE):
                if path.exists():
                    path.unlink()
                    logging.warning(f"Deleted {path}")

        users_tree, users_root = load_users_xml()
        user_ids, group_ids = current_id_maps(users_root)
        root_pg_id = get_root_pg_id()
        # Ensure monitoring user exists and is tracked before purges
        mon_uid = ensure_user(users_root, MONITORING_USER, user_ids)
        current_users.add(MONITORING_USER)

        # Ensure the initial admin identity (from authorizers.xml / Helm auth.admin)
        # always exists in users.xml. NiFi only bootstraps this on a truly fresh
        # start (no users.xml), so policysync must keep it present.
        initial_admin = os.getenv("INITIAL_ADMIN_IDENTITY", "").strip()

        # Detect and remove a stale initial admin when INITIAL_ADMIN_IDENTITY changes.
        # The general purge (removed_users = old_users - current_users) only catches
        # identities that policysync itself previously tracked.  An admin bootstrapped
        # by NiFi on first start may never appear in USER_TRACK_FILE, so we keep a
        # dedicated one-line tracker just for the initial admin identity.
        prev_admin = ADMIN_TRACK_FILE.read_text().strip() if ADMIN_TRACK_FILE.exists() else ""
        if prev_admin and prev_admin != initial_admin:
            logging.info(f"INITIAL_ADMIN_IDENTITY changed from '{prev_admin}' to '{initial_admin}'; removing stale entry")
            old_uid = generate_id("user", prev_admin)
            _users_elem = users_root.find("users")
            if _users_elem is not None:
                old_user_el = _users_elem.find(f"./user[@identifier='{old_uid}']")
                if old_user_el is not None:
                    _users_elem.remove(old_user_el)
                    changed_users = True
                    logging.info(f"Removed stale initial admin '{prev_admin}' ({old_uid}) from users.xml")

        if initial_admin:
            ensure_user(users_root, initial_admin, user_ids)
            current_users.add(initial_admin)
            logging.debug(f"Ensured initial admin identity '{initial_admin}'")
        
        # Create & track internal managed NiFi users
        apply_managed_users(users_root, user_ids, current_users)

        # Assign mapped managed users into their Helm-defined groups
        for usr, grps in managed_user_groups.items():
            uid = user_ids.get(usr)
            if uid:
                for grp in grps:
                    gid = ensure_group(users_root, grp, group_ids)
                    grp_elem = users_root.find(f".//group[@name='{grp}']")
                    if grp_elem is not None and not grp_elem.find(f"./user[@identifier='{uid}']"):
                        ET.SubElement(grp_elem, "user", {"identifier": uid})
                        current_users.add(usr)
        # Managed groups in users.xml
        if ENABLE_MANAGED_GROUPS:
            for grp, members in managed_groups.items():
                gid = ensure_group(users_root, grp, group_ids)
                for m in members:
                    uid = ensure_user(users_root, m, user_ids)
                    current_users.add(m)
                    grp_elem = users_root.find(f".//group[@name='{grp}']")
                    if grp_elem is not None and not grp_elem.find(f"./user[@identifier='{uid}']"):
                        ET.SubElement(grp_elem, "user", {"identifier": uid})

        # Node users (skipped when shared node identity mapping consolidates all
        # nodes into the single SHARED_NODE_IDENTITY handled below)
        node_uids = []
        if not SHARED_NODE_IDENTITY:
            node_uids = [ensure_user(users_root, NODE_USER_TEMPLATE.format(i=i), user_ids) for i in range(REPLICA_COUNT)]
            for idx, uid in enumerate(node_uids):
                uname = NODE_USER_TEMPLATE.format(i=idx)
                current_users.add(uname)

        # Shared mapped node identity (when shared-node identity mapping is enabled)
        shared_node_uid = None
        if SHARED_NODE_IDENTITY:
            shared_identity_exists = SHARED_NODE_IDENTITY in user_ids
            shared_node_uid = ensure_user(users_root, SHARED_NODE_IDENTITY, user_ids)
            current_users.add(SHARED_NODE_IDENTITY)
            if shared_identity_exists:
                logging.debug(f"Shared node identity already present '{SHARED_NODE_IDENTITY}'")
            else:
                logging.info(f"Ensured shared node identity '{SHARED_NODE_IDENTITY}'")

        # Compute removed users/groups now — needed for both users.xml cleanup
        # (always) and policy purge (only when root_pg_id is available).
        old_users = load_tracked_users()
        removed_users = old_users - current_users
        old_groups = load_tracked_groups()
        removed_groups = old_groups - set(external_group_roles.keys())

        # ——— Remove stale entries from users.xml (always, no root PG ID needed) ———
        users_elem  = users_root.find("users")
        groups_elem = users_root.find("groups")
        for usr in removed_users:
            uid = generate_id("user", usr)
            # 1) Remove the <user> element
            user_el = users_elem.find(f"./user[@identifier='{uid}']")
            if user_el is not None:
                users_elem.remove(user_el)
                changed_users = True
                logging.info(f"Removed user '{usr}' ({uid}) from users.xml")
            # 2) Remove them from any <group> memberships
            for grp_el in (groups_elem.findall("group") if groups_elem is not None else []):
                member_el = grp_el.find(f"./user[@identifier='{uid}']")
                if member_el is not None:
                    grp_el.remove(member_el)
                    changed_users = True
                    logging.info(
                        f"Removed user '{usr}' ({uid}) from group '{grp_el.attrib['name']}'"
                    )

        if root_pg_id:
            # Load or initialize authorizations.xml
            if AUTH_XML_PATH.exists():
                auth_tree = ET.parse(AUTH_XML_PATH)
                auth_root = auth_tree.getroot()
                strip_namespaces(auth_root)
            else:
                auth_root = ET.Element("authorizations")
                auth_tree = ET.ElementTree(auth_root)
            policies_elem = auth_root.find("policies") or ET.SubElement(auth_root, "policies")

            # Assign per-node-user permissions (node_uids is empty when
            # SHARED_NODE_IDENTITY is set, so this loop is a no-op there)
            node_permissions = [
                ("R", "/data/process-groups/ROOT_PG"),
                ("W", "/data/process-groups/ROOT_PG"),
                ("R", "/site-to-site"),
                ("R", "/controller"),
                ("R", "/system"),
                ("W", "/proxy"),
            ]
            for idx, uid in enumerate(node_uids):
                uname = NODE_USER_TEMPLATE.format(i=idx)
                for action, resource in node_permissions:
                    add_policy(
                        policies_elem,
                        action,
                        resource.replace("ROOT_PG", root_pg_id),
                        [uid],
                        [],
                        [uname],
                        []
                    )

            # Grant the same node permissions to the shared mapped identity
            if shared_node_uid:
                for action, resource in node_permissions:
                    add_policy(
                        policies_elem,
                        action,
                        resource.replace("ROOT_PG", root_pg_id),
                        [shared_node_uid],
                        [],
                        [SHARED_NODE_IDENTITY],
                        []
                    )

            # Apply managed group policies
            if ENABLE_MANAGED_GROUPS:
                for grp, role in managed_group_roles.items():
                    gid = ensure_group(users_root, grp, group_ids)
                    for action, resource in role_privileges.get(role, []):
                        add_policy(
                            policies_elem,
                            action,
                            resource.replace("ROOT_PG", root_pg_id),
                            [user_ids[m] for m in managed_groups.get(grp, []) if m in user_ids],
                            [gid],
                            [m for m in managed_groups.get(grp, []) if m in user_ids],
                            [grp]
                        )

            # Apply external LDAP group policies
            for grp, role in external_group_roles.items():
                logging.info(f"Processing LDAP group '{grp}' with role '{role}'")
                gid = generate_group_uuid(grp)
                for action, resource in role_privileges.get(role, []):
                    add_policy(
                        policies_elem,
                        action,
                        resource.replace("ROOT_PG", root_pg_id),
                        [],
                        [gid],
                        [],
                        [grp]
                    )

            # Purge removed managed users from policies
            if removed_users:
                logging.info(f"Detected removed managed users: {removed_users}")
                for usr in removed_users:
                    uid = generate_id("user", usr)
                    for policy in list(policies_elem.findall("policy")):
                        for uel in policy.findall("user"):
                            if uel.attrib.get("identifier") == uid:
                                logging.info(f"Removing user '{usr}' ({uid}) from policy {policy.attrib['action']}:{policy.attrib['resource']}")
                                policy.remove(uel)
                                changed_auth = True
                        if not policy.findall("group") and not policy.findall("user"):
                            logging.info(f"Removing empty policy {policy.attrib['action']}:{policy.attrib['resource']}")
                            policies_elem.remove(policy)
                            changed_auth = True

            # Purge removed external groups from policies
            if removed_groups:
                logging.info(f"Detected removed LDAP groups: {removed_groups}")
                for grp in removed_groups:
                    gid = generate_group_uuid(grp)
                    for policy in list(policies_elem.findall("policy")):
                        for g in policy.findall("group"):
                            if g.attrib.get("identifier") == gid:
                                logging.info(f"Removing group '{grp}' ({gid}) from policy {policy.attrib['action']}:{policy.attrib['resource']}")
                                policy.remove(g)
                                changed_auth = True
                        if not policy.findall("group") and not policy.findall("user"):
                            logging.info(f"Removing empty policy {policy.attrib['action']}:{policy.attrib['resource']}")
                            policies_elem.remove(policy)
                            changed_auth = True

            # Monitoring user policies
            mon_uid = user_ids[MONITORING_USER]
            {{- if .Values.metrics.prometheus.enabled }}
            for action, resource in role_privileges["monitoring"]:
                add_policy(
                    policies_elem,
                    action,
                    resource.replace("ROOT_PG", root_pg_id),
                    [mon_uid],
                    [],
                    [MONITORING_USER],
                    []
                )
            {{- end }}
        else:
            logging.warning(
                "flow.json.gz not found — root process group ID unknown on first boot. "
                "users.xml will be written but authorizations.xml will be skipped. "
                "Auth policies will be applied on the next pod restart after NiFi has started."
            )

        # Backup & write
        ts = datetime.now().strftime("%Y%m%dT%H%M%S")
        if changed_users:
            if USERS_XML_PATH.exists():
                dst = BACKUP_DIR / f"{USERS_XML_PATH.name}.{ts}.bak"
                shutil.copy2(USERS_XML_PATH, dst)
                logging.debug(f"Backed up users.xml → {dst}")
            else:
                logging.debug("users.xml does not exist yet (first boot); skipping backup")
            USERS_XML_PATH.write_text(prettify(users_root))
            logging.info("users.xml updated")
        if changed_auth:
            if AUTH_XML_PATH.exists():
                dst = BACKUP_DIR / f"{AUTH_XML_PATH.name}.{ts}.bak"
                shutil.copy2(AUTH_XML_PATH, dst)
                logging.debug(f"Backed up authorizations.xml → {dst}")
            else:
                logging.debug("authorizations.xml does not exist yet (first boot); skipping backup")
            AUTH_XML_PATH.write_text(prettify(auth_root))
            logging.info("authorizations.xml updated")
        if not changed_users and not changed_auth:
            logging.info("No changes detected; nothing to write or backup")

        # Persist trackers
        save_track(USER_TRACK_FILE, current_users)
        save_track(GROUP_TRACK_FILE, set(external_group_roles.keys()))
        if initial_admin:
            ADMIN_TRACK_FILE.write_text(initial_admin)

    if __name__ == "__main__":
        main()
{{/* end UserPolicySync.enabled */}}{{ end }}

{{- if eq (include "nifi.secretSyncEnabled" $) "true" }}
  create-secrets-vault.sh: |
    #!/bin/bash
    echo "INFO - -------------------------- Starting Generic secret sync --------------------------"

    # Variables (populated via Helm)
    NAMESPACE="{{ $.Release.Namespace }}"
    KUBERNETES_API_SERVER="https://kubernetes.default.svc"
    VAULT_ENABLED="{{ .Values.NiFiSync.vault.enabled }}"  # Flag to determine whether to use Vault
    VAULT_ADDR="{{ .Values.NiFiSync.vault.address }}"     # Vault address
    VAULT_ROLE="{{ .Values.NiFiSync.vault.role }}"         # Vault role used for Kubernetes authentication
    VAULT_NAMESPACE="{{ .Values.NiFiSync.vault.namespace }}"  # Vault namespace used to store secrets
    VAULT_MOUNT="{{ .Values.NiFiSync.vault.mount }}"          # Vault mount path
    VAULT_PATH="{{ .Values.NiFiSync.vault.path }}"            # Vault path used to store secrets
    LOCAL_DATA_DIR="/tmp/secrets-data"  # Directory to store local secret data for comparison
    FOUND_SECRETS=()  # Array to keep track of found secret names
    ADDED_SECRETS=()  # Array to keep track of added/updated secret names

    # Paths for service account credentials
    SA_TOKEN_PATH="/run/secrets/kubernetes.io/secret-modifier-token/token"
    VAULT_SA_TOKEN_PATH="/run/secrets/kubernetes.io/default-token/token"
    KUBE_CA_PATH="/run/secrets/kubernetes.io/serviceaccount/ca.crt"



    # Function to base64 encode files
    encode_file() {
      local file="$1"
      base64 -w 0 "$file"
    }
    
    # Function to authenticate to Vault using Kubernetes service account token
    authenticate_with_vault() {
      echo "INFO - Authenticating with Vault using Kubernetes service account..."

      VAULT_TOKEN=$(curl -s --request POST \
        --header "X-Vault-Namespace: $VAULT_NAMESPACE" \
        --data "{\"jwt\": \"$(cat $VAULT_SA_TOKEN_PATH)\", \"role\": \"$VAULT_ROLE\"}" \
        --cacert <(echo "$KUBE_CA_PATH") \
        "$VAULT_ADDR/v1/auth/$VAULT_MOUNT/login" | jq -r '.auth.client_token')
    
      if [ "$VAULT_TOKEN" == "null" ] || [ -z "$VAULT_TOKEN" ]; then
        echo "ERROR - Vault authentication failed."
        exit 1
      else
        echo "INFO - Successfully authenticated with Vault."
      fi
    }
    
    
    check_certs() {
      local TOKEN="$(cat /run/secrets/kubernetes.io/secret-modifier-token/token)"  # Kubernetes API token from the Pod's service account
      local secret_name="$1"
      local data="$2"
      local local_data_file="$3"
      local secret_type="$4"
      local sync_task=""

      # If no local cache file, attempt to retrieve existing secret from K8s or Vault
      if [ ! -f "$local_data_file" ]; then
        echo "INFO - No local data cache found for $secret_name. Checking Kubernetes for existing secret..." >&2
      
        # Try to pull the existing secret from Kubernetes
        existing_secret=$(curl --cacert /run/secrets/kubernetes.io/serviceaccount/ca.crt -s -o /dev/null -w "%{http_code}" -X GET \
          -H "Authorization: Bearer $TOKEN" \
          -H "Accept: application/json" \
          "$KUBERNETES_API_SERVER/api/v1/namespaces/$NAMESPACE/secrets/$secret_name")
          # Try to pull the existing secret from Vault
          
    
        if [ "$existing_secret" == "200" ]; then
          echo "INFO - Existing secret found in Kubernetes for $secret_name. Saving to local file..." >&2
         
          #####VAULT READ
          if [ "$secret_type" == "vault" ]; then
            # If stored in Vault
            echo "INFO - Reading $secret_name from Vault and saving to local file..." >&2
            cresponse=$(curl -s -X GET \
              --header "X-Vault-Token: $VAULT_TOKEN" \
              --cacert <(echo "$KUBE_CA_PATH") \
              "$VAULT_ADDR/v1/$VAULT_NAMESPACE/$VAULT_MOUNT/data/$VAULT_PATH/$secret_name")
            kubernetes_data=$(echo "$cresponse" | jq -c '.data')
            kubernetes_data=$(echo $kubernetes_data | jq -c '.data')
            # Force base64 so it matches the format you compare later
            kubernetes_data=$(echo "$kubernetes_data" | jq '. |= with_entries(.value |= @base64)')
            echo $kubernetes_data > $local_data_file

          else
            # If stored in Kubernetes
            echo "INFO - Reading $secret_name from Kubernetes and saving to local file..." >&2
            cresponse=$(curl --cacert /run/secrets/kubernetes.io/serviceaccount/ca.crt -s -X GET \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/json" \
              "$KUBERNETES_API_SERVER/api/v1/namespaces/$NAMESPACE/secrets/$secret_name")
            kubernetes_data=$(echo "$cresponse" | jq -c '.data')
            echo $kubernetes_data > $local_data_file
          fi
        else
          echo "INFO - No existing secret found in Kubernetes for $secret_name. Creating a new one..." >&2
          sync_task="new"
        fi
      else
        # local data exists
        echo "INFO - Local data cache found for $secret_name." >&2
        kubernetes_data=$(cat "$local_data_file")
      fi
      
      # Compare the existing and new secret data

      local_data=$(echo "$data" | jq -c '.data')
      kubernetes_data=$(echo "$kubernetes_data" | jq -c)
      #DEBUG SHOW BOTH THE CONTENTS
      #echo =============k8s-data------------------ >&2
      #echo kubernetes_data >&2
      #echo $kubernetes_data >&2
      #echo local_data >&2
      #echo $local_data >&2
      #echo =============k8s-data------------------ >&2
      if [ "$kubernetes_data" == "$local_data" ]; then
        echo "INFO - The existing local data for $secret_name matches the new data. No update needed." >&2
        sync_task="match"
        printf "match"
      else
        if [ "$sync_task" == "new" ]; then
          printf "new"
        else
          sync_task="update"
          printf "update"
        fi
      fi >&1
    }
    
    
    # Function to write secrets to Vault

    
    write_to_vault() {
      local secret_name="$1"
      local secret_data="$2"
      local local_data_file="$3"
      local sync_type="$4"
      local secret_pathtype="$5"
    
      if [ "$sync_type" == "new" ] || [ "$sync_type" == "update" ]; then
        echo "INFO - Writing secret: $secret_name to Vault..." >&2
    
        # Decode the base64 so Vault gets raw file contents
        decoded_data=$(echo "$secret_data" | jq '.data |= with_entries(.value |= @base64d)')
        echo $decoded_data
    
        # Pipe decoded_data to curl via stdin
        http_status=$(
          echo "$decoded_data" | \
          curl -s -o /dev/null -w "%{http_code}" \
          -X POST \
          --header "X-Vault-Token: $VAULT_TOKEN" \
          --cacert <(echo "$KUBE_CA_PATH") \
          --data-binary @- \
          "$VAULT_ADDR/v1/$VAULT_NAMESPACE/$VAULT_MOUNT/data/$VAULT_PATH/$secret_name"
        )
    
        if [ "$http_status" -eq 200 ] || [ "$http_status" -eq 204 ]; then
          echo "INFO - Successfully wrote secret: $secret_name to Vault" >&2
          create_vault_kubernetes_secrets "$secret_name" "$sync_type" "$local_data_file" "$secret_pathtype"
        else
          echo "ERROR - Failed to write secret: $secret_name to Vault" >&2
          echo $http_status
        fi
      fi

    }
    
    # Function to write secrets to Kubernetes
    create_vault_kubernetes_secrets() {
      local TOKEN="$(cat /run/secrets/kubernetes.io/secret-modifier-token/token)"  # Kubernetes API token from the Pod's service account
      local secret_name="$1"
      local sync_type="$2"
      local local_data_file="$3"
      local secret_pathtype="$4"
    
      if [ "$sync_type" == "new" ]; then
        echo "INFO - Creating new VaultStaticSecret $secret_name in Kubernetes..."
        VAULT_STATIC_SECRET='{
          "apiVersion": "secrets.hashicorp.com/v1beta1",
          "kind": "VaultStaticSecret",
          "metadata": {
            "name": "'"$secret_name"'",
            "namespace": "'"$NAMESPACE"'"
          },
          "spec": {
            "type": "kv-v2",
            "mount": "'"$VAULT_MOUNT"'",
            "path": "'"$VAULT_PATH/$secret_name"'",
            "destination": {
              "name": "'"$secret_name"'",
              "create": true,
              "type": "'"$secret_pathtype"'"
            },
            "refreshAfter": "30m",
            "vaultAuthRef": "'"vaultauth-$VAULT_MOUNT"'"
          }
        }'
        cresponse=$(curl --cacert /run/secrets/kubernetes.io/serviceaccount/ca.crt -s -o /dev/null -w "%{http_code}" -X POST \
          -H "Authorization: Bearer $TOKEN" \
          -H "Content-Type: application/json" \
          -d "$VAULT_STATIC_SECRET" \
          "$KUBERNETES_API_SERVER/apis/secrets.hashicorp.com/v1beta1/namespaces/$NAMESPACE/vaultstaticsecrets")
        if [ "$cresponse" == "201" ]; then
          echo "INFO - Successfully created new secret: $secret_name"
        else
          echo "ERROR - Failed to create secret: $secret_name"
          echo "ERROR - Failure Response: $cresponse"
        fi
      elif [ "$sync_type" == "update" ]; then
        echo "INFO - Updating existing VaultStaticSecret $secret_name in Kubernetes..."
        VAULT_STATIC_SECRET='{
          "apiVersion": "secrets.hashicorp.com/v1beta1",
          "kind": "VaultStaticSecret",
          "metadata": {
            "name": "'"$secret_name"'",
            "namespace": "'"$NAMESPACE"'",
            "annotations": {
              "force-refresh": "'$(date +%s)'"
            }
          },
          "spec": {
            "type": "kv-v2",
            "mount": "'"$VAULT_MOUNT"'",
            "path": "'"$VAULT_PATH/$secret_name"'",
            "destination": {
              "name": "'"$secret_name"'",
              "create": true,
              "type": "'"$secret_pathtype"'"
            },
            "refreshAfter": "30m",
            "vaultAuthRef": "'"vaultauth-$VAULT_MOUNT"'"
          }
        }'
        cresponse=$(curl --cacert /run/secrets/kubernetes.io/serviceaccount/ca.crt -s -o /dev/null -w "%{http_code}" -X PATCH \
          -H "Authorization: Bearer $TOKEN" \
          -H "Content-Type: application/merge-patch+json" \
          -d "$VAULT_STATIC_SECRET" \
          "$KUBERNETES_API_SERVER/apis/secrets.hashicorp.com/v1beta1/namespaces/$NAMESPACE/vaultstaticsecrets/$secret_name")
        if [ "$cresponse" == "200" ]; then
          echo "INFO - Successfully updated VaultStaticSecret: $secret_name"
        else
          echo "ERROR - Failed to update VaultStaticSecret: $secret_name"
        fi
      fi
    
      # Add secret name to the added/updated secrets array
      ADDED_SECRETS+=("$secret_name")
      # Update the local data file with the new data
      echo "INFO - Updating local data cache for $secret_name"
      cleaned_data=$(echo "$data" | jq -c '.data')
      echo "$cleaned_data" > "$local_data_file" 
    }
    
    # Function to write secrets directly to Kubernetes
    write_to_kubernetes() {
      local TOKEN="$(cat /run/secrets/kubernetes.io/secret-modifier-token/token)"  # Kubernetes API token from the Pod's service account
      local secret_name="$1"
      local data="$2"
      local local_data_file="$3"
      local sync_type="$4"
    
      if [ "$sync_type" == "new" ]; then
        echo "INFO - Creating new secret $secret_name in Kubernetes..."
        cresponse=$(
          echo "$data" | \
          curl --cacert /run/secrets/kubernetes.io/serviceaccount/ca.crt -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @- \
            "$KUBERNETES_API_SERVER/api/v1/namespaces/$NAMESPACE/secrets"
        )
        if [ "$cresponse" == "201" ]; then
          echo "INFO - Successfully created new secret: $secret_name"
          ADDED_SECRETS+=("$secret_name")
        else
          echo "ERROR - Failed to create secret: $secret_name"
          echo "ERROR - Failure Response: $cresponse"          
        fi
      elif [ "$sync_type" == "update" ]; then
        echo "INFO - Updating existing secret $secret_name in Kubernetes..."
        cresponse=$(
          echo "$data" | \
          curl --cacert /run/secrets/kubernetes.io/serviceaccount/ca.crt -s -o /dev/null -w "%{http_code}" \
            -X PATCH \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/merge-patch+json" \
            --data-binary @- \
            "$KUBERNETES_API_SERVER/api/v1/namespaces/$NAMESPACE/secrets/$secret_name"
        )
        if [ "$cresponse" == "200" ]; then
          echo "INFO - Successfully updated secret: $secret_name"
          # Add secret name to the added/updated secrets array
          ADDED_SECRETS+=("$secret_name")
        else
          echo "ERROR - Failed to update secret: $secret_name"
        fi
      fi
    
      # Update local data file
      cleaned_data=$(echo "$data" | jq -c '.data')
      echo "$cleaned_data" > "$local_data_file"
      echo "INFO - Local data cache for $secret_name updated."
    }
    
    # Create local data dir
    mkdir -p "$LOCAL_DATA_DIR"
    
    # Authenticate with Vault if VAULT_ENABLED is true
    if [ "$VAULT_ENABLED" == "true" ]; then
      authenticate_with_vault
    fi
    
    # Iterate over each syncPath with pathType: generic-secret, tls-secret, ca-secret, etc.
    {{- range .Values.NiFiSync.syncPaths }}
    {{- if and (default true .enabled) (or (ne .pathType "tls-secret") $.Values.ingress.enabled) }}
      {{- $syncPath := . }}
      {{- $pathType := .pathType }}
      {{- $secretType := (default $.Values.NiFiSync.DefaultSecretType $syncPath.secretType) | lower }}
      # Common variables
      {{- if eq $secretType "kubernetes" }}
        SECRET_NAME="{{ template "apache-nifi.fullname" $ }}-{{ .pathName }}"
        SECRET_TYPE="kubernetes"
      {{- else if eq $secretType "vault" }}
        SECRET_NAME="vault-{{ template "apache-nifi.fullname" $ }}-{{ .pathName }}"
        SECRET_TYPE="vault"
      {{- end }}
      FOLDER_PATH="/tmp/sync{{ .localPath }}"
      LOCAL_DATA_FILE="$LOCAL_DATA_DIR/$SECRET_NAME.json"
      # Process based on pathType
      {{- if eq $pathType "generic-secret" }}
        ##########################################################
        # GENERIC SECRET (Opaque)
        ##########################################################
        secret_pathtype="Opaque"
        echo "INFO - Processing Opaque Secret: $SECRET_NAME"
    
        # Use temp files instead of big shell variables
        data_tmp_file=$(mktemp)
        echo '{}' > "$data_tmp_file"
    
    
        for file in "$FOLDER_PATH"/*; do
          if [ -f "$file" ]; then
            filename="$(basename "$file")"
            file_content="$(encode_file "$file")"
    
            # Build up JSON using stdin + temp file
            jq --arg k "$filename" --arg v "$file_content" '. + {($k): $v}' \
              < "$data_tmp_file" \
              > "$data_tmp_file.new"
            mv "$data_tmp_file.new" "$data_tmp_file"
    
          fi
        done
    
        # Construct final JSON with jq reading from stdin
        data=$(jq --arg name "$SECRET_NAME" --arg namespace "$NAMESPACE" '
          {
            apiVer1sion: "v1",
            kind: "Secret",
            metadata: {
              name: $name,
              namespace: $namespace
            },
            type: "Opaque",
            data: .
          }
        ' < "$data_tmp_file")
    
        datapayload=$(jq '{data: .}' < "$data_tmp_file")
    
        # Add to found secrets
        FOUND_SECRETS+=("$SECRET_NAME")
    
        echo "INFO - Starting Check Certs for Opaque Secret"
        sync_task=$(check_certs "$SECRET_NAME" "$data" "$LOCAL_DATA_FILE" "$SECRET_TYPE")
        echo "INFO - ===================================="
        echo "INFO - Secret Name: $SECRET_NAME"
        echo "INFO - Sync Task: $sync_task"
        echo "INFO - Secret Type: $secret_pathtype"
        echo "INFO - Destination: $SECRET_TYPE"
        echo "INFO - ===================================="
    
        if [ "$sync_task" == "new" ] || [ "$sync_task" == "update" ]; then
          echo "INFO - Modifying Opaque Secret: $SECRET_NAME"
          # Write the secret based on secretType
          {{- if eq $secretType "kubernetes" }}
            write_to_kubernetes "$SECRET_NAME" "$data" "$LOCAL_DATA_FILE" "$sync_task" 
          {{- else if eq $secretType "vault" }}
            write_to_vault "$SECRET_NAME" "$datapayload" "$LOCAL_DATA_FILE" "$sync_task" "$secret_pathtype"
          {{- else }}
            {{- fail "Invalid secretType '{{ $secretType }}' for syncPath '{{ $syncPath.pathName }}'. Allowed values are 'kubernetes' or 'vault'." }}
          {{- end }}
          echo "INFO - Completed Processing Opaque Secret: $SECRET_NAME"
          echo "INFO - ===================================="
        fi
      {{- else if eq $pathType "tls-secret" }}
        ##########################################################
        # TLS SECRET (kubernetes.io/tls)
        ##########################################################
        secret_pathtype="kubernetes.io/tls"
        # Process TLS Secret
        echo "INFO - Processing TLS Secret: $SECRET_NAME"

        # Files expected: tls.crt and tls.key
        crt_file="$FOLDER_PATH/tls.crt"
        key_file="$FOLDER_PATH/tls.key"

        if [[ ! -f "$crt_file" ]] || [[ ! -f "$key_file" ]]; then
          # These per-path blocks are unrolled by a Helm range (not a shell
          # loop), so `continue` has no loop to skip; gate with else instead.
          echo "WARNING - tls.crt and/or tls.key not present in $FOLDER_PATH; skipping TLS secret $SECRET_NAME"
        else

        # Encode the files
        crt_content="$(encode_file "$crt_file")"
        key_content="$(encode_file "$key_file")"
    
        # Build JSON in a temp file
        tls_tmp_file=$(mktemp)
        jq -n --arg crt "$crt_content" --arg key "$key_content" \
           '{ "tls.crt": $crt, "tls.key": $key }' \
           > "$tls_tmp_file"
    
        # Final K8s JSON
        data=$(jq --arg name "$SECRET_NAME" --arg namespace "$NAMESPACE" '
          {
            apiVersion: "v1",
            kind: "Secret",
            metadata: {
              name: $name,
              namespace: $namespace
            },
            type: "kubernetes.io/tls",
            data: .
          }
        ' < "$tls_tmp_file")
    
        datapayload=$(jq '{data: .}' < "$tls_tmp_file")
    
        FOUND_SECRETS+=("$SECRET_NAME")
        echo "INFO - Starting Check Certs for TLS Secret"
        sync_task=$(check_certs "$SECRET_NAME" "$data" "$LOCAL_DATA_FILE" "$SECRET_TYPE")
        echo "INFO - ===================================="
        echo "INFO - Secret Name: $SECRET_NAME"
        echo "INFO - Sync Task: $sync_task"
        echo "INFO - Secret Type: $secret_pathtype"
        echo "INFO - Destination: $SECRET_TYPE"
        echo "INFO - ===================================="
        if [ "$sync_task" == "new" ] || [ "$sync_task" == "update" ]; then
          echo "INFO - Modifying TLS Secret: $SECRET_NAME"
          # Write the secret based on secretType
          {{- if eq $secretType "kubernetes" }}
            write_to_kubernetes "$SECRET_NAME" "$data" "$LOCAL_DATA_FILE" "$sync_task" 
          {{- else if eq $secretType "vault" }}
            write_to_vault "$SECRET_NAME" "$datapayload" "$LOCAL_DATA_FILE" "$sync_task" "$secret_pathtype"
          {{- else }}
            {{- fail "Invalid secretType '{{ $secretType }}' for syncPath '{{ $syncPath.pathName }}'. Allowed values are 'kubernetes' or 'vault'." }}
          {{- end }}
          echo "INFO - Completed Processing TLS Secret: $SECRET_NAME"
          echo "INFO - ===================================="
        fi
        fi  # end tls.crt/tls.key presence guard


      {{- else if eq $pathType "ca-secret" }}
        ##########################################################
        # CA SECRET (Opaque)
        ##########################################################
        secret_pathtype="Opaque"
        echo "INFO - Processing CA Secret: $SECRET_NAME"
        
        # Build CA cert data via tmpfile
        ca_tmp_file=$(mktemp)
        echo '{}' > "$ca_tmp_file"
    
        for cert_file in "$FOLDER_PATH"/*; do
          if [ -f "$cert_file" ]; then
            CERT_NAME=$(basename "$cert_file" | cut -f 1 -d '.')
            CERT_NAME_LOWER=$(echo "$CERT_NAME" | tr '[:upper:]' '[:lower:]')
            CERT_CONTENT=$(encode_file "$cert_file")
            key_name="${CERT_NAME_LOWER}-ca.crt"
    
            # Append to JSON
            jq --arg k "$key_name" --arg v "$CERT_CONTENT" '. + {($k): $v}' \
              < "$ca_tmp_file" \
              > "$ca_tmp_file.new"
            mv "$ca_tmp_file.new" "$ca_tmp_file"
          else
            echo "INFO - $cert_file is not a regular file. Skipping..."
          fi
        done
    
        data=$(jq --arg name "$SECRET_NAME" --arg namespace "$NAMESPACE" '
          {
            apiVersion: "v1",
            kind: "Secret",
            metadata: {
              name: $name,
              namespace: $namespace
            },
            type: "Opaque",
            data: .
          }
        ' < "$ca_tmp_file")
    
        datapayload=$(jq '{data: .}' < "$ca_tmp_file")
        # Add secret name to the found secrets array
        FOUND_SECRETS+=("$SECRET_NAME")
        echo "INFO - Starting Check Certs for CA Secret"
        sync_task=$(check_certs "$SECRET_NAME" "$data" "$LOCAL_DATA_FILE" "$SECRET_TYPE")
        echo "INFO - ===================================="
        echo "INFO - Secret Name: $SECRET_NAME"
