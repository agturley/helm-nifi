{{- if .Values.awsSecretsSync.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ .Release.Name }}-aws-secrets-sync-config
data:
  config.yaml: |
    region: {{ .Values.awsSecretsSync.region | quote }}
    output_path: {{ .Values.awsSecretsSync.outputPath | quote }}
    sync_mode: {{ .Values.awsSecretsSync.syncMode | quote }}
    sync_interval_minutes: {{ .Values.awsSecretsSync.syncInterval }}
    log_level: {{ .Values.awsSecretsSync.logLevel | quote }}
    secrets:
{{- range .Values.awsSecretsSync.secrets }}
    - name: {{ .name | quote }}
      output_file: {{ default (base .name) .outputFile | quote }}
{{- if .outputPath }}
      output_path: {{ .outputPath | quote }}
{{- end }}
{{- if .flattenTo }}
      flatten_to: {{ .flattenTo | quote }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ .Release.Name }}-aws-secrets-sync-script
data:
  fetch-secrets.py: |
    #!/usr/bin/env python3
    """AWS Secrets Manager sidecar for NiFi.

    Fetches secrets from AWS Secrets Manager and writes them as files.
    JSON-valued secrets are exploded into per-key files inside a subdirectory.
    Credentials are resolved via boto3's default chain (IRSA / instance profile /
    environment variables).
    """
    import base64
    import json
    import logging
    import os
    import sys
    import time
    from pathlib import Path

    try:
        import boto3
        from botocore.exceptions import ClientError, NoCredentialsError
        import yaml
    except ImportError as exc:
        print(
            f"Missing dependency: {exc}. Install with: pip install boto3 pyyaml",
            file=sys.stderr,
        )
        sys.exit(1)


    def setup_logging(log_level: str = "INFO") -> logging.Logger:
        logging.basicConfig(
            format="%(asctime)s %(levelname)-8s %(message)s",
            datefmt="%Y-%m-%dT%H:%M:%S",
            level=getattr(logging, log_level.upper(), logging.INFO),
        )
        return logging.getLogger("aws-secrets-sync")


    def load_config(config_path: str) -> dict:
        with open(config_path) as f:
            return yaml.safe_load(f) or {}


    def _get_secret_value(client, secret_id: str) -> str:
        """Return the plaintext string value of a secret."""
        resp = client.get_secret_value(SecretId=secret_id)
        if "SecretString" in resp:
            return resp["SecretString"]
        # Binary secret — decode to UTF-8 string
        return base64.b64decode(resp["SecretBinary"]).decode("utf-8")


    def _atomic_write(dest: Path, content: str) -> None:
        """Write content to dest atomically via a sibling tmp file."""
        tmp = dest.with_suffix(".tmp")
        tmp.write_text(content, encoding="utf-8")
        os.chmod(tmp, 0o600)
        tmp.rename(dest)


    def write_secret(
        value: str,
        output_dir: Path,
        output_file: str,
        logger: logging.Logger,
        flatten_to_path: "Path | None" = None,
    ) -> None:
        """Write secret to disk.

        If the value is a JSON object, each key is written as a separate file
        inside a subdirectory named *output_file*.  Otherwise the raw value is
        written to *output_dir/output_file*.

        When *flatten_to_path* is set, JSON keys are also written directly into
        that directory so that flat-file readers (e.g. secretsMode: file-dir)
        can find them without descending into the subdirectory.
        """
        output_dir.mkdir(parents=True, exist_ok=True)

        try:
            data = json.loads(value)
            if isinstance(data, dict):
                secret_dir = output_dir / output_file
                secret_dir.mkdir(parents=True, exist_ok=True)
                for key, val in data.items():
                    _atomic_write(secret_dir / key, str(val))
                logger.info("Wrote %d key(s) to %s/", len(data), secret_dir)
                if flatten_to_path is not None:
                    flatten_to_path.mkdir(parents=True, exist_ok=True)
                    for key, val in data.items():
                        _atomic_write(flatten_to_path / key, str(val))
                    logger.info("Flattened %d key(s) to %s/", len(data), flatten_to_path)
                return
        except (json.JSONDecodeError, TypeError, ValueError):
            pass

        _atomic_write(output_dir / output_file, value)
        logger.info("Wrote secret to %s", output_dir / output_file)


    def sync_all(client, config: dict, logger: logging.Logger) -> None:
        default_output_path = Path(
            config.get("output_path", "/opt/nifi/aws-secrets")
        )
        secrets = config.get("secrets") or []
        if not secrets:
            logger.warning("No secrets configured — nothing to sync.")
            return

        errors = 0
        for entry in secrets:
            name = (entry.get("name") or "").strip()
            if not name:
                logger.warning("Skipping entry with no name: %s", entry)
                continue

            output_file = entry.get("output_file") or Path(name).name
            output_dir = Path(entry.get("output_path") or str(default_output_path))
            flatten_raw = entry.get("flatten_to")
            flatten_to_path = Path(flatten_raw) if flatten_raw else None

            logger.info("Fetching secret: %s", name)
            try:
                value = _get_secret_value(client, name)
                write_secret(value, output_dir, output_file, logger, flatten_to_path)
            except ClientError as exc:
                logger.error("AWS error fetching '%s': %s", name, exc)
                errors += 1
            except Exception as exc:  # noqa: BLE001
                logger.error("Unexpected error fetching '%s': %s", name, exc)
                errors += 1

        if errors:
            logger.warning("%d secret(s) failed to sync.", errors)


    def log_caller_identity(logger: logging.Logger) -> None:
        """Log the resolved AWS caller identity and IRSA env vars at DEBUG level."""
        # IRSA injects these; log them so misconfiguration is obvious
        role_arn = os.environ.get("AWS_ROLE_ARN", "(not set)")
        token_file = os.environ.get("AWS_WEB_IDENTITY_TOKEN_FILE", "(not set)")
        access_key = os.environ.get("AWS_ACCESS_KEY_ID", "(not set)")
        session_token_present = "yes" if os.environ.get("AWS_SESSION_TOKEN") else "no"
        logger.debug(
            "IRSA env — AWS_ROLE_ARN=%s  AWS_WEB_IDENTITY_TOKEN_FILE=%s  "
            "AWS_ACCESS_KEY_ID=%s  AWS_SESSION_TOKEN present=%s",
            role_arn, token_file, access_key, session_token_present,
        )
        try:
            from botocore.config import Config as BotocoreConfig
            sts = boto3.client(
                "sts",
                config=BotocoreConfig(connect_timeout=5, read_timeout=5, retries={"max_attempts": 1}),
            )
            identity = sts.get_caller_identity()
            logger.debug(
                "Resolved AWS identity — Account=%s  ARN=%s  UserId=%s",
                identity.get("Account"),
                identity.get("Arn"),
                identity.get("UserId"),
            )
        except Exception as exc:  # noqa: BLE001
            logger.debug("Could not resolve caller identity (sts:GetCallerIdentity): %s", exc)


    def main() -> None:
        config_path = os.environ.get(
            "AWS_SECRETS_CONFIG", "/etc/aws-secrets-sync/config.yaml"
        )
        try:
            config = load_config(config_path)
        except FileNotFoundError:
            print(f"Config file not found: {config_path}", file=sys.stderr)
            sys.exit(1)

        log_level = config.get("log_level") or os.environ.get("LOG_LEVEL", "INFO")
        logger = setup_logging(log_level)
        logger.info("AWS Secrets Manager sync starting (config: %s)", config_path)
        log_caller_identity(logger)

        region = config.get("region") or os.environ.get("AWS_DEFAULT_REGION", "us-east-1")
        default_output_path = config.get("output_path", "/opt/nifi/aws-secrets")
        secrets = config.get("secrets") or []
        logger.debug(
            "Configuration — region=%s  sync_mode=%s  sync_interval_minutes=%s  "
            "default_output_path=%s  endpoint_url=%s",
            region,
            config.get("sync_mode", "interval"),
            config.get("sync_interval_minutes", 10),
            default_output_path,
            config.get("endpoint_url") or os.environ.get("AWS_SECRETS_ENDPOINT_URL", "(default)"),
        )
        if secrets:
            logger.debug("Secrets to sync (%d):", len(secrets))
            for entry in secrets:
                name = (entry.get("name") or "").strip()
                output_file = entry.get("output_file") or Path(name).name
                output_dir = entry.get("output_path") or default_output_path
                logger.debug("  secret='%s'  output_dir='%s'  output_file='%s'", name, output_dir, output_file)
        else:
            logger.debug("No secrets configured.")
        endpoint_url = config.get("endpoint_url") or os.environ.get(
            "AWS_SECRETS_ENDPOINT_URL"
        )

        try:
            client = boto3.client(
                "secretsmanager",
                region_name=region,
                **({"endpoint_url": endpoint_url} if endpoint_url else {}),
            )
        except NoCredentialsError:
            logger.error(
                "No AWS credentials found. Configure IRSA, an instance profile, "
                "or set AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY."
            )
            sys.exit(1)

        sync_mode = config.get("sync_mode", "interval")
        sync_interval_seconds = int(config.get("sync_interval_minutes", 10)) * 60

        # Initial sync
        sync_all(client, config, logger)

        # Write readiness sentinel so other containers can detect when the first
        # fetch has completed and credential files are available.
        _sentinel = Path(default_output_path) / ".aws-secrets-ready"
        _sentinel.parent.mkdir(parents=True, exist_ok=True)
        _sentinel.write_text("ready\n", encoding="utf-8")
        logger.info("Wrote readiness sentinel: %s", _sentinel)

        if sync_mode == "interval":
            logger.info(
                "Interval mode: refreshing every %d minute(s).",
                sync_interval_seconds // 60,
            )
            while True:
                time.sleep(sync_interval_seconds)
                logger.info("Refreshing secrets...")
                sync_all(client, config, logger)
        else:
            logger.info("One-shot mode complete.")


    if __name__ == "__main__":
        main()
{{- end }}
