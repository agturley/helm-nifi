---
{{- if .Values.scaleDownGuard.enabled }}
{{/*
ValidatingAdmissionPolicy and its Binding are CLUSTER-scoped, so the release
namespace has to be part of the name: two releases of this chart that resolve to
the same fullname in different namespaces would otherwise collide on install,
and the second would either fail or silently adopt the first one's policy - which
points its matchConditions at the wrong namespace.
*/}}
{{- $guardName := printf "%s-%s-scaledown-guard" .Release.Namespace (include "apache-nifi.fullname" .) }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $guardName }}
  labels:
{{- include "nifi.commonLabels" . | nindent 4 }}
    app: {{ include "apache-nifi.name" . | quote }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}"
    release: {{ .Release.Name | quote }}
    heritage: {{ .Release.Service | quote }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:   ["apps"]
      apiVersions: ["v1"]
      operations:  ["UPDATE"]
      # Both are needed: a full object apply (helm upgrade, kubectl apply/edit)
      # goes through "statefulsets"; `kubectl scale` and the HPA go through
      # the "statefulsets/scale" subresource instead, which is a distinct
      # resource for admission-matching purposes even though the request
      # targets the same object.
      resources:   ["statefulsets", "statefulsets/scale"]
  # Scoped by name/namespace rather than labels: the "statefulsets/scale"
  # subresource is an autoscaling/v1.Scale object that carries metadata.name
  # and metadata.namespace but no metadata.labels, so an objectSelector-based
  # binding silently never matches scale-subresource requests.
  matchConditions:
  - name: is-target-statefulset
    expression: >-
      object.metadata.name == {{ include "apache-nifi.fullname" . | quote }}
      && object.metadata.namespace == {{ .Release.Namespace | quote }}
  validations:
  - expression: "object.spec.replicas >= oldObject.spec.replicas - {{ .Values.scaleDownGuard.maxStepDown }}"
    messageExpression: >-
      "Scaling down more than {{ .Values.scaleDownGuard.maxStepDown }} replica(s) at a time is blocked for this StatefulSet ("
      + string(oldObject.spec.replicas) + " -> " + string(object.spec.replicas)
      + " requested); reduce replicaCount incrementally instead."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $guardName }}-binding
  labels:
{{- include "nifi.commonLabels" . | nindent 4 }}
    app: {{ include "apache-nifi.name" . | quote }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}"
    release: {{ .Release.Name | quote }}
    heritage: {{ .Release.Service | quote }}
spec:
  policyName: {{ $guardName }}
  # The policy's matchConstraints necessarily select every StatefulSet UPDATE in
  # the cluster (a resourceRule cannot be namespaced), and failurePolicy is Fail,
  # so without this every such request in every namespace depends on this policy
  # evaluating cleanly. namespaceSelector narrows that at the API server, before
  # the matchConditions run, and unlike objectSelector it works for the
  # statefulsets/scale subresource too - it matches labels on the Namespace
  # object rather than on the admitted object, and kubernetes.io/metadata.name is
  # set automatically on every namespace by the API server.
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace | quote }}
  validationActions: ["Deny"]
{{- end }}
