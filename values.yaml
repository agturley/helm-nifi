---
# Number of nifi nodes
replicaCount: 1

## Set default image, imageTag, and imagePullPolicy.
## ref: https://hub.docker.com/r/apache/nifi/
##

global:
  security:
    ## Used for Bitnami Zookeeper Image
    allowInsecureImages: true

labels:
  prefix: ""
  appid: ""
  environment: ""
  region: ""
  owner: ""

image:
  repository: apache/nifi
  tag: "2.9.0"
  pullPolicy: "IfNotPresent"

  ## Optionally specify an imagePullSecret.
  ## Secret must be manually created in the namespace.
  ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  ##
  # pullSecret: myRegistrKeySecretName_secret

#securityContext:
#  runAsUser: 1000
#  fsGroup: 1000

## @param useHostNetwork - boolean - optional
## Bind ports on the hostNetwork. Useful for CNI networking where hostPort might
## not be supported. The ports need to be available on all hosts. It can be
## used for custom metrics instead of a service endpoint.
##
## WARNING: Make sure that hosts using this are properly firewalled otherwise
## metrics and traces are accepted from any host able to connect to this host.
#

#Legacy Hashicorp settings######
hashicorp:
  enabled: false
  vaultUri: http://vault.vault.svc:8200
  vaultKvPath: nifi-kv
  vaultKvVersion: 2
  vaultAuthentication: TOKEN
  vaultToken: root
  vaultAuthenticationPropertiesFile:
  vaultConnectionTimeout: 5 secs
  vaultReadTimeout: 15 secs


sts:
  # Parallel podManagementPolicy for faster bootstrap and teardown. Default is OrderedReady.
  podManagementPolicy: Parallel
  AntiAffinity: soft
  useHostNetwork: null
  hostPort: null
  pod:
    annotations: {}
      #prometheus.io/scrape: "true"
  serviceAccount:
    create: false
    #name: nifi
    annotations: {}
  hostAliases: []
#    - ip: "1.2.3.4"
#      hostnames:
#        - example.com
#        - example

  startupProbe:
    enabled: false
    failureThreshold: 60
    periodSeconds: 10

## Useful if using any custom secrets
## Pass in some secrets to use (if required)
# secrets:
# - name: myNifiSecret
#   keys:
#     - key1
#     - key2
#   mountPath: /opt/nifi/secret

## Useful if using any custom configmaps
## Pass in some configmaps to use (if required)
# configmaps:
#   - name: myNifiConf
#     keys:
#       - myconf.conf
#     mountPath: /opt/nifi/custom-config


properties:
  instanceName: SOMENAME
  # secretsMode controls how NiFi reads its runtime credentials (TLS passwords,
  # LDAP bind credentials, sensitive-props key, S3 keys, etc.) at container startup.
  #
  #   none        – credentials are rendered directly from this values.yaml
  #                 (certManager.*Passwd, auth.ldap.pass, properties.sensitiveKey, …).
  #                 Use only for non-production / demo deployments.
  #
  #   file-dir    – each credential is a separate file inside secretsFilePath/,
  #                 named after its key (e.g. NIFI_TLS_KEYSTORE_PASSWORD).
  #                 Compatible with K8s Secrets projected as individual files,
  #                 VSO secret-operator, awsSecretsSync sidecar, etc.
  #
  #   file-single – all credentials live in one KEY=VALUE (.env) file located at
  #                 secretsFilePath/secretsFile.  The file is sourced with
  #                 `set -a; . FILE; set +a` at container startup.
  #
  #   env         – credentials arrive as environment variables already set on the
  #                 container (e.g. via env[] or envFrom[] referencing a K8s Secret).
  #                 No file reads are performed.
  #
  # NOTE: when certManager.useMergedCACerts=true, bootstrap.conf JVM truststore
  # args (java.arg.100-102) are rendered by Helm, then the server startup script
  # rewrites java.arg.102 to use runtime NIFI_TLS_TRUSTSTORE_PASSWORD.
  #
  # UseK8sSecrets is deprecated (2.8.0); use secretsMode: file-dir instead.
  secretsMode: ""         # none | file-dir | file-single | env  (empty = legacy UseK8sSecrets)
  secretsFile: "credentials.env"  # filename within secretsFilePath for file-single mode
  #
  # secretsFilePath: base directory for file-dir and file-single modes.
  # secretsName (optional): name of a Kubernetes Secret to project into secretsFilePath;
  #   leave empty when files are written by a sidecar.
  secretsName: ""
  secretsFilePath: /opt/nifi/secrets
  # https://nifi.apache.org/docs/nifi-docs/html/administration-guide.html#nifi_sensitive_props_key
  sensitiveKey: "sensitiveKey" #changeMe # Must have at least 12 characters
  # NiFi assumes conf/nifi.properties is persistent but this helm chart
  # recreates it every time.  Setting the Sensitive Properties Key
  # (nifi.sensitive.props.key) is supposed to happen at the same time
  # /opt/nifi/data/flow.xml.gz sensitive properties are encrypted.  If that
  # doesn't happen then NiFi won't start because decryption fails.
  # So if sensitiveKeySetFile is configured but doesn't exist, assume
  # /opt/nifi/flow.xml.gz hasn't been encrypted and follow the procedure
  # https://nifi.apache.org/docs/nifi-docs/html/administration-guide.html#updating-the-sensitive-properties-key
  # to simultaneously encrypt it and set nifi.sensitive.props.key.
  # sensitiveKeySetFile: /opt/nifi/data/sensitive-props-key-applied
  # If sensitiveKey was already set, then pass in sensitiveKeyPrior with the old key.
  # sensitiveKeyPrior: OldPasswordToChangeFrom
  algorithm: NIFI_PBKDF2_AES_GCM_256
  # use externalSecure for when inbound SSL is provided by nginx-ingress or other external mechanism
  externalSecure: false
  isNode: false
  httpsPort: 8443
  webProxyHost: # <clusterIP>:<NodePort> (If Nifi service is NodePort or LoadBalancer)
  clusterPort: 6007
  clusterProtocolIsSecure: true
  zkClientEnsembleTraker: false # https://issues.apache.org/jira/browse/NIFI-10481
  clusterNodeConnectionTimeout: '30 sec'
  clusterNodeReadTimeout: '30 sec'
  clusterNodeProtocolThreads: '10'
  clusterNodeProtocolMaxThreads: '50'
  clusterProtocolHeartbeatInterval: '30 sec'
  zookeeperConnectTimeout: '3 secs'
  zookeeperSessionTimeout: '3 secs'
  archiveMaxRetentionPeriod: "3 days"
  archiveMaxUsagePercentage: "25%"
  archiveEnabled: false
  archiveAlwaysSync: true
  archiveMaxAppendableSize: "50 KB"
  provenanceStorage: "8 GB"
  provenanceMaxStorageTime: "10 days"
  flowArchiveMaxTime: "30 days"
  flowArchiveMaxStorage: "500 MB"
  flowAutoResumeState: true
  autoloadLibPath: "./extensions"
  flowRegistrySyncInterval: "1 hour"
  # kerberosKrb5Path: /opt/nifi/data/custom/security/krb5.conf
  siteToSite:
    port: 10000
  # use properties.safetyValve to pass explicit 'key: value' pairs that overwrite other configuration
  safetyValve:
    #nifi.variable.registry.properties: "${NIFI_HOME}/example1.properties, ${NIFI_HOME}/example2.properties"
    nifi.web.http.network.interface.default: eth0
    # listen to loopback interface so "kubectl port-forward ..." works
    nifi.web.http.network.interface.lo: lo
  statusHistory:
    persistStatusHistory: false

jvm:
  heapSize: "8g"
  gcCollector: "g1gc"      # Options: zgc, g1gc
  gcLogging:
    enabled: true
    path: "/opt/nifi/nifi-current/logs/gc.log"
    fileCount: 5
    fileSize: "20m"

  # GC tuning - leave any value empty to use JVM defaults.
  # Most users should not need to set these.
  zgc:
    generational: true        # Java 21+
    alwaysPreTouch: true
    uncommitDelay: 300        # seconds before returning unused heap to OS
    disableExplicitGC: true   # suppress System.gc() calls
    concGCThreads:            # leave unset; ZGC self-tunes based on heap size
    extraArgs: []

  g1gc:
    maxGCPauseMillis:
    heapRegionSize:
    newSizePercent:
    maxNewSizePercent:
    mixedGCLiveThresholdPercent:
    initiatingHeapOccupancyPercent:
    concGCThreads:
    parallelGCThreads:
    alwaysPreTouch: true
    extraArgs: []

Logging:
  enabled: false
  clusterOutput:
  kubernetesDnsServer:


VaultNiFiSecrets:
  secretProvider: vaultSecretOperator  #vaultSidecar  
  enabled: false
  defaultSecretAddress: ""         
  defaultAuthPath:           #"e1rke400-e1-poc2000"
  defaultMount:              #"e1rke400-e1-poc2000"
  defaultNamespace:          #"tra/tra-e1"
  defaultRole:               #'role-e1rke400-e1-poc2000'
  defaultPath:               #"nifi/traarchival01"
  defaultContainerPath: /opt/nifi/secrets
  defaultSecretMode: directory
  logLevel: INFO
  vaultSidecarImage: ""  # Required: set to your vault sidecar image when secretProvider=vaultSidecar
  vaultSidecar:
    logging: false
    restproxy_url: ""  # Set to your Kafka REST proxy URL for vault sidecar logging
    topic: 'vault-logs'
    syncMode: interval
    syncInterval: 10 #minutes
  secrets:            # List of additional secrets to fetch from Vault
    - name: nifi-secrets
    #- name: example-secret                 #Name of secret in vault
    #  mount: othermount                    #Override default vault mount for this secret only  
    #  path: other/path                     #path to secret in vault
    #  containerPath: "/opt/nifi/custom"    #Override default container path for this secret only
    #  secretMode: env                      #Override default secret mode for this secret only (env|file|directory)

# AWS Secrets Manager sidecar
# When enabled, a Python sidecar fetches secrets from AWS Secrets Manager and
# writes them as files under outputPath, which is shared with the NiFi container.
# Authentication uses boto3's standard credential chain — prefer IRSA (annotate
# the pod's ServiceAccount with an IAM role ARN) or an EC2 instance profile.
# Optionally reference a Kubernetes Secret containing AWS_ACCESS_KEY_ID and
# AWS_SECRET_ACCESS_KEY via credentialsSecret.
awsSecretsSync:
  enabled: false
  region: us-east-1
  # Default directory where secret files are written inside the NiFi pod
  outputPath: /opt/nifi/aws-secrets
  # sync_mode: interval (keep refreshing) | once (fetch at startup only)
  syncMode: interval
  syncInterval: 10   # minutes; only used when syncMode=interval
  logLevel: INFO
  image:
    repository: python
    tag: "3.12-slim"
    pullPolicy: IfNotPresent
    # pullSecret: myRegistrySecret
  # Set installPackages: false when using a pre-built image that already
  # includes boto3 and pyyaml (required in air-gapped / no-internet envs).
  installPackages: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  # Optional Kubernetes Secret name whose keys AWS_ACCESS_KEY_ID,
  # AWS_SECRET_ACCESS_KEY (and optionally AWS_SESSION_TOKEN) are injected
  # as environment variables.  Leave empty when using IRSA / instance profile.
  credentialsSecret: ""
  # Optional: override the AWS Secrets Manager endpoint (e.g. for VPC endpoints)
  # endpointUrl: "https://secretsmanager.us-east-1.amazonaws.com"
  secrets: []
  # - name: my/secret/name       # Secrets Manager secret name or full ARN
  #   outputFile: my-secret      # filename (or dir name for JSON secrets) written
  #                              # under outputPath; defaults to the last path component
  #   outputPath: ""             # override the default outputPath for this secret only

NiFiSync:
  # Define one or more paths to sync dynamically, shared between different sync methods
  #fs: The remote path is synced to the "localPath" in the pod.
  #generic-secret: The remote path is synced to a kubernets secret and mounted to the "localPath"
  #tls-secret: The remote path must only have a tls.key and tls.crt file. this will be created as a kubernets "tls-secret" that can be used for the nginx-ingress. This will also be mounted to the "localPath" Defined
  #ca-secret: This will take the conents of the "remotePath" and create an individual kubernetes secrets using the name of each file as the secret name. the contents of the file will be stored to "ca.crt" in the secret. This is intended to be used with cert manager to add provided CAs to the NiFi System truststore.jks.
  vault:
    enabled: false
    address: #"https://your-vault-address"
    role: #'role-e1rke400-e1-poc2000'
    namespace: #"tra/tra-e1"
    path: #"nifi/<clustername>"
    mount: #"e1rke400-e1-poc2000"
  DefaultSecretType: kubernetes #Global secret type: 'kubernetes' or 'vault' (vault NifiSync.Vault must be enalbed to use 'vault')
  syncPaths:
    - pathName: custom-drivers
      localPath: /opt/nifi/data/custom/drivers
      remotePath: custom/drivers
      pathType: fs
    - pathName: custom-extensions
      localPath: /opt/nifi/data/custom/extensions
      remotePath: custom/extensions
      pathType: fs
    - pathName: custom-security
      localPath: /opt/nifi/data/custom/security
      remotePath: custom/secuirty
      pathType: fs
    - pathName: custom-certs
      localPath: /opt/nifi/data/custom/certs
      remotePath: custom/certs
      pathType: generic-secret

    - pathName: ingress-cert
      localPath: /opt/nifi/data/custom/tls/nifi-ingress-cert
      remotePath: system/nifi-ingress-cert
      pathType: tls-secret

    - pathName: system-ca
      localPath: /opt/nifi/data/custom/tls/system-ca
      remotePath: system/cas
      pathType: ca-secret

  s3Sync:
    enable: false
    syncInterval: 1d
    # User adjustable endpoint for S3-compatible services (AWS, MinIO, etc.)
    endpoint: https://s3.us-east-1.amazonaws.com # Default AWS S3 URL. Replace for MinIO.
    bucket: mybucket
    sidecar:
      image: docker.io/agturley/nifi-utility:v1
    flowBackup:
      enabled: true
      interval: 1d
      retention:
        enabled: true          # turn pruning on/off globally
        dryRun: false          # don't actually delete; just log
        flow:
          keepDays: 30         # delete flow-*.json.gz older than X days
          maxVersions: 60      # also keep only the newest N versioned flow files
        archive:
          enabled: true       # enable if you also want remote archive/ pruned
          keepDays: 30         # delete archive/ objects older than X days

  UserPolicySync:
    enabled: false

    # External LDAP groups (not created in users.xml) & their roles
    externalGroupRoles:
    #  someLDAPgroupName: admin
    #  someOtherLDAPgroupName: rw

    managedGroupRoles:
    #  someadmingroup: admin
    #  somerwgroup: rw
    #  somerogroup: ro

    # Internal NiFi users to create & track
    managedUsers:
    #  - alice
    #  - bob
    #  - charlie

    # Which of the above users should belong to which groups
    managedUserGroups:
    #  alice:
    #    - someadmingroup
    #  bob:
    #    - somerogroup
    #  charlie:
    #    - somerwgroup

    # External LDAP groups (not created in users.xml) & their roles


  ## Include aditional processors
  # customLibPath: "/opt/configuration_resources/custom_lib"

## Include additional libraries in the Nifi containers by using the postStart handler
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/attach-handler-lifecycle-event/
# postStart: /opt/nifi/psql; wget -P /opt/nifi/psql https://jdbc.postgresql.org/download/postgresql-42.2.6.jar

# Nifi User Authentication
auth:
  # If set while LDAP is enabled, this value will be used for the initial admin and not the ldap bind dn / admin
  admin: CN=admin
  SSL:
    keystorePasswd: "keystorePasswd" #changeMe_secret
    truststorePasswd: "truststorePasswd" #changeMe_secret

  # Automaticaly disabled if OIDC or LDAP enabled
  singleUser:
    username: username
    password: "password1234" #changeme_secret # Must to have at least 12 characters
    generateSecret: false # If true, generates a random password (and username if not set) stored in a K8s Secret; username above is used when provided

  clientAuth:
    enabled: false

  ldap:
    enabled: false
    host: #ldap://<hostname>:<port>
    searchBase: #CN=Users,DC=ldap,DC=example,DC=be
    admin: #cn=admin,dc=ldap,dc=example,dc=be
    pass: "pass" #ChangeMe
    disableEndpointIdentification: false
    userSearchScope: ONE_LEVEL # Search scope for searching users (ONE_LEVEL, OBJECT, or SUBTREE). Required if searching users.
    searchFilter: (objectClass=*)
    userIdentityAttribute: sAMAccountName
    authStrategy: SIMPLE # How the connection to the LDAP server is authenticated. Possible values are ANONYMOUS, SIMPLE, LDAPS, or START_TLS.
    referralStrategy: FOLLOW # How LDAP referrals are handled. Possible values are FOLLOW, IGNORE, or THROW.
    identityStrategy: USE_DN
    authExpiration: 12 hours
    groupSearchBase: #CN=Users,DC=ldap,DC=example,DC=be   
    groupSearchScope: ONE_LEVEL # Search scope for searching groups (ONE_LEVEL, OBJECT, or SUBTREE). Required if searching groups.
    groupSearchFilter: (objectClass=*)
    groupUserIdentityAttribute: sAMAccountName
    groupNameAttribute: sAMAccountName
    groupMemberAttribute: member
    groupMemberAttributeReferencedUser: distinguishedName   


  oidc:
    enabled: false
    discoveryUrl: #http://<oidc_provider_address>:<oidc_provider_port>/auth/realms/<client_realm>/.well-known/openid-configuration
    clientId: #<client_name_in_oidc_provider>
    clientSecret: #<client_secret_in_oidc_provider>
    claimIdentifyingUser: email
    admin: nifi@example.com
    preferredJwsAlgorithm:
    ## Request additional scopes, for example profile
    additionalScopes:

## Expose the nifi service to be accessed from outside the cluster (LoadBalancer service).
## or access it from within the cluster (ClusterIP service). Set the service type and the port to serve it.
## ref: http://kubernetes.io/docs/user-guide/services/
##

# headless service
headless:
  type: ClusterIP
  annotations:
    service.alpha.kubernetes.io/tolerate-unready-endpoints: "true"

# ui service
service:
  type: ClusterIP
  httpsPort: 8443
  # nodePort: 30236
  annotations: {}
    # loadBalancerIP:
    ## Load Balancer sources
    ## https://kubernetes.io/docs/tasks/access-application-cluster/configure-cloud-provider-firewall/#restrict-access-for-loadbalancer-service
    ##
    # loadBalancerSourceRanges:
    # - 10.10.10.0/24
    ## OIDC authentication requires "sticky" session on the LoadBalancer for JWT to work properly...but AWS doesn't like it on creation
    # sessionAffinity: ClientIP
    # sessionAffinityConfig:
    #   clientIP:
  #     timeoutSeconds: 10800

  # Enables additional port/ports to nifi service for internal processors
  processors:
    enabled: false
    ports:
      - name: processor01
        port: 7001
        targetPort: 7001
        #nodePort: 30701
      - name: processor02
        port: 7002
        targetPort: 7002
        #nodePort: 30702
## Configure containerPorts section with following attributes: name, containerport and protocol.
containerPorts: []
# - name: example
#   containerPort: 1111
#   protocol: TCP

## Configure Ingress based on the documentation here: https://kubernetes.io/docs/concepts/services-networking/ingress/
##
ingress:
  enabled: false
  # className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/affinity: cookie
    nginx.ingress.kubernetes.io/affinity-mode: persistent
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/session-cookie-expires: "172800"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "172800"
    nginx.ingress.kubernetes.io/session-cookie-name: route
  tls: []
  hosts: []
  path: /
  # If you want to change the default path, see this issue https://github.com/cetic/helm-nifi/issues/22

# Separate image for tailing each log separately and checking zookeeper connectivity
sidecar:
  image: busybox
  tag: "1.37.0"
  imagePullPolicy: "IfNotPresent"

## Enable persistence using Persistent Volume Claims
## ref: http://kubernetes.io/docs/user-guide/persistent-volumes/
##
persistence:
  enabled: false

  # When creating persistent storage, the NiFi helm chart can either reference an already-defined
  # storage class by name, such as "standard" or can define a custom storage class by specifying
  # customStorageClass: true and providing the "storageClass", "storageProvisioner" and "storageType".
  # For example, to use SSD storage on Google Compute Engine see values-gcp.yaml
  #
  # To use a storage class that already exists on the Kubernetes cluster, we can simply reference it by name.
  # For example:
  # storageClass: standard
  #
  # The default storage class is used if this variable is not set.

  accessModes:  [ReadWriteOnce]

  ## Use subPath and have 1 persistent volume instead of 7 volumes - use when your k8s nodes have limited volume slots, to limit waste of space,
  ##  or your available volume sizes are quite large
  #  The one disk will have a directory folder for each volumeMount, but this is hidden. Run 'mount' to view each mount.
  subPath:
    enabled: false
    name: data
    size: 30Gi

  ## Storage Capacities for persistent volumes (these are ignored if using one volume with subPath)
  statusRepoStorage:
    size: 10Gi
    DisallowSubPath: false    
  sshStorage:
    size: 100Mi
    DisallowSubPath: false    
  configStorage:
    size: 100Mi
    DisallowSubPath: false 
  customStorage:
    size: 2Gi
    DisallowSubPath: false 
  authconfStorage:
    size: 100Mi
    DisallowSubPath: false 
  # Storage capacity for the 'data' directory, which is used to hold things such as the flow.xml.gz, configuration, state, etc.
  dataStorage:
    size: 1Gi
    DisallowSubPath: false 
  # Storage capacity for the FlowFile repository
  flowfileRepoStorage:
    size: 10Gi
    DisallowSubPath: false
    inMemory: false
  # Storage capacity for the Content repository
  contentRepoStorage:
    size: 10Gi
    DisallowSubPath: false
    inMemory: false    
  # Storage capacity for the Provenance repository. When changing this, one should also change the properties.provenanceStorage value above, also.
  provenanceRepoStorage:
    size: 10Gi
    DisallowSubPath: false
    inMemory: false    
  # Storage capacity for nifi logs
  logStorage:
    size: 5Gi
    DisallowSubPath: false 

## Configure resource requests and limits
## ref: http://kubernetes.io/docs/user-guide/compute-resources/
##
resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #  cpu: 100m
  #  memory: 128Mi
  # requests:
  #  cpu: 100m
  #  memory: 128Mi

logresources:
  requests:
    cpu: 10m
    memory: 10Mi
  limits:
    cpu: 50m
    memory: 50Mi
zookeeperInit:
  # Set to false to skip the zookeeper connectivity init container
  enabled: false
zookeeperResources: #built in zookeeper sidecar container resources NOT the external zookeeper
  requests:
    cpu: 10m
    memory: 10Mi
  limits:
    cpu: 50m
    memory: 50Mi
syncresources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 128Mi
extraContainerResources:
    limits:
      cpu: 2000m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

## Enables setting your own affinity. Mutually exclusive with sts.AntiAffinity
## You need to set the value of sts.AntiAffinity other than "soft" and "hard"
affinity: {}

nodeSelector: {}

tolerations: []

initContainers: {}
  # foo-init:  # <- will be used as container name
  #   image: "busybox:1.30.1"
  #   imagePullPolicy: "IfNotPresent"
  #   command: ['sh', '-c', 'echo this is an initContainer']
  #   volumeMounts:
  #     - mountPath: /tmp/foo
  #       name: foo

extraVolumeMounts: []

extraVolumes: []

## Extra containers
extraContainers: []

terminationGracePeriodSeconds: 30

## Extra environment variables that will be pass onto deployment pods
env: []

## Extra environment variables from secrets and config maps
envFrom: []

## Extra options to add to the bootstrap.conf file
extraOptions: []

# envFrom:
#   - configMapRef:
#       name: config-name
#   - secretRef:
#       name: mysecret

## Openshift support
## Use the following varables in order to enable Route and Security Context Constraint creation
openshift:
  scc:
    enabled: false
  route:
    enabled: false
    #host: www.test.com
    #path: /nifi

# ca server details
# cert-manager support
# Setting this true will have cert-manager create a private CA for the cluster
# as well as the certificates for each cluster node.
certManager:
  enabled: false
  # When true (default), the chart creates cert-manager Issuer and Certificate
  # resources to automatically provision TLS secrets for each NiFi node.
  # Set to false to supply the secrets manually (e.g. when cert-manager CRD
  # permissions are not available in AWS). The sidecar and RBAC resources are
  # still created so the sidecar can read the pre-provisioned secrets.
  manageCerts: true
  clusterDomain: cluster.local
  keystorePasswd: "keystorePasswd" #changeme_secret
  truststorePasswd: "truststorePasswd" #changeme_secret
  # If true, build a merged truststore from JVM default cacerts + chart-provided CAs,
  # and point JVM TLS trustStore to that merged file.
  useMergedCACerts: true
  # Optional explicit path to JVM/system cacerts source file used when
  # useMergedCACerts=true (e.g. /etc/pki/java/cacerts on some RHEL/UBI images).
  # Leave empty to auto-detect under ${JAVA_HOME:-/usr/lib/jvm}.
  jvmCACertsPath: ""
  # Source password of jvmCACertsPath/auto-detected JVM cacerts before re-keying.
  jvmCACertsStorePasswd: "changeit"
  replaceDefaultTrustStore: false
  additionalDnsNames:
    - localhost
  refreshSeconds: 300
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 128Mi
  # cert-manager takes care of rotating the node certificates, so default
  # their lifetime to 90 days.  But when the CA expires you may need to
  # 'helm delete' the cluster, delete all the node certificates and secrets,
  # and then 'helm install' the NiFi cluster again.  If a site-to-site trusted
  # CA or a NiFi Registry CA certificate expires, you'll need to restart all
  # pods to pick up the new version of the CA certificate.  So default the CA
  # lifetime to 10 years to avoid that happening very often.
  # c.f. https://github.com/cert-manager/cert-manager/issues/2478#issuecomment-1095545529
  certDuration: 2160h
  caDuration: 87660h

# ------------------------------------------------------------------------------
# Kubernetes-native clustering (NiFi 2.x+)
# When enabled, NiFi uses Kubernetes Leases for leader election and ConfigMaps
# for cluster state instead of ZooKeeper.  Set zookeeper.enabled: false and
# sts.serviceAccount.create: true when using this mode.
# ------------------------------------------------------------------------------
kubernetesClusterState:
  enabled: false
  # Optional prefix applied to Lease resource names — useful when multiple NiFi
  # clusters share the same namespace.
  leasePrefix: ""

# ------------------------------------------------------------------------------
# Zookeeper:
# ------------------------------------------------------------------------------
zookeeper:
  ## If true, install the Zookeeper chart
  ## ref: https://github.com/bitnami/charts/blob/master/bitnami/zookeeper/values.yaml
  enabled: true
  ## If the Zookeeper Chart is disabled a URL and port are required to connect
  url: ""
  port: 2181
  ## Optional: override the full connect string (e.g. "host1:2181,host2:2181").
  ## If set, this takes precedence over the auto-generated value.
  # connectString: ""
  replicaCount: 3
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
  # Explicitly set as empty list to avoid Helm coalescing tra-nifi's top-level
  # initContainers: {} (map) into this subchart where a list is expected.
  initContainers: []
# Configure metrics
metrics:
  prometheus:
    # Enable Prometheus metrics
    enabled: false
    # used by nginx to proxy prometheus metrics
    kubernetesDnsServer: rke2-coredns-rke2-coredns.kube-system.svc.cluster.local
    # Port used to expose Prometheus metrics
    port: 9092
    serviceMonitor:
      # Enable deployment of Prometheus Operator ServiceMonitor resource
      enabled: false
      # namespace: monitoring
      # Additional labels for the ServiceMonitor

      # ===============================
      # Metric filtering (default: ON)
      # ===============================
      #
      # If omitted or set to true:
      #   - Only selected NiFi metrics are ingested
      # If set to false:
      #   - ALL NiFi metrics are ingested (no filtering)
      #
      # filterEnabled defaults to true if not set
      #
      # filterEnabled: false

      # ======================================
      # Process Group filtering by ID (exact)
      # ======================================
      #
      # List of NiFi Process Group IDs to KEEP.
      # Metrics for these groups and their direct children are ingested.
      #
      # Preferred over names because IDs are stable and unambiguous.
      #
      
      # keepComponentIDs:
      #   - f1beb035-019a-1000-ffff-ffffa07c7bef   # example-flow
      #   - b4951d48-0197-1000-225d-3d6a64d3a9e8   # main-root-subflow

      # keepParentIDs:
      #   - f1beb035-019a-1000-ffff-ffffa07c7bef

      # ========================================
      # Process Group filtering by Name (approx)
      # ========================================
      # List of NiFi Components to keep by name.
      # keepComponentNames:
      #   - 'exampleComponentName'


      labels: {}
